<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>STRATEGIKON LPM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Source+Sans+3:wght@400;600;700&family=Stardos+Stencil:wght@700&display=swap">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="table.css">
</head>
<body>

<!-- ===== Accueil : partie, rôle, table ===== -->
<section id="ecran-accueil" class="seuil">
  <div class="seuil-carte">
    <p class="surtitre">École de guerre · LPM 2027-2032</p>
    <h1 class="logo">STRATEGIKON</h1>

    <form id="form-rejoindre" class="seuil-form" autocomplete="off">
      <label for="rej-partie">Partie</label>
      <select id="rej-partie" required></select>
      <label for="rej-mdp">Mot de passe</label>
      <input id="rej-mdp" type="password" required>
      <button class="btn-laiton" type="submit">Entrer</button>
      <p class="erreur" id="rej-erreur" role="alert"></p>
      <button class="btn-lien" id="btn-montrer-creer" type="button">Ouvrir une nouvelle partie</button>
    </form>

    <form id="form-creer" class="seuil-form" autocomplete="off" hidden>
      <label for="cre-nom">Nom de la nouvelle partie</label>
      <input id="cre-nom" placeholder="Bageia 5" maxlength="80" required>
      <label for="cre-mdp">Mot de passe</label>
      <input id="cre-mdp" type="password" minlength="4" required>
      <label for="cre-mdp2">Confirmation</label>
      <input id="cre-mdp2" type="password" minlength="4" required>
      <button class="btn-laiton" type="submit">Ouvrir la partie</button>
      <p class="erreur" id="cre-erreur" role="alert"></p>
      <button class="btn-lien" id="btn-montrer-rejoindre" type="button">Revenir à la liste des parties</button>
    </form>

    <div id="etape-role" hidden>
      <p class="seuil-q">Votre rôle dans <b id="nom-partie-role"></b></p>
      <div class="liste-roles" id="grille-roles"></div>
      <button class="btn-lien" id="btn-retour-partie" type="button">Changer de partie</button>
    </div>
  </div>
  <p class="note-mode" id="note-mode"></p>
</section>

<!-- ===== La table ===== -->
<section id="ecran-partie" hidden>
  <header class="bandeau">
    <div class="bandeau-in">
      <span class="logo-petit">STRATEGIKON</span>
      <span class="poste-partie" id="poste-partie"></span>
      <button class="insigne" id="btn-role" type="button" title="Changer de rôle"><span id="insigne-code"></span><small id="insigne-nom"></small></button>
      <button class="btn-lien" id="btn-quitter" type="button">Quitter</button>
    </div>
    <div class="annees-jauges" id="jauges" role="tablist" aria-label="Année"></div>
  </header>

  <main class="atelier">
    <section class="zone-table" aria-label="Table budgétaire">
      <div class="zone-table-tete">
        <div class="table-releve" id="table-releve"></div>
        <div class="bascules">
          <div class="bascule" role="group" aria-label="Pions affichés">
            <button type="button" data-filtre="mien" aria-pressed="true">Ma demande</button>
            <button type="button" data-filtre="tout" aria-pressed="false">Toute la table</button>
          </div>
          <div class="bascule" role="group" aria-label="Vue">
            <button type="button" data-vue="demandes" aria-pressed="true">Demandes</button>
            <button type="button" data-vue="arbitrage" aria-pressed="false">Après arbitrage</button>
          </div>
        </div>
      </div>
      <p class="consigne" id="consigne"></p>
      <div class="defile"><div class="plateau" id="plateau"></div></div>
      <div class="hors-table" id="hors-table"></div>
      <div class="legende" id="legende"></div>
    </section>

    <aside class="volet" aria-label="Panneau">
      <nav class="volet-onglets" id="volet-onglets" role="tablist"></nav>
      <div class="volet-corps" id="volet"></div>
    </aside>
  </main>
</section>

<div class="toast" id="toast" role="status" hidden></div>

<script src="../js/config.js"></script>
<script src="../data/pions.js"></script>
<script src="../data/catalogue_roles.js"></script>
<script src="../js/moteur.js"></script>
<script src="../js/stockage.js"></script>
<script src="figuratifs.js"></script>
<script src="app.js"></script>
</body>
</html>
