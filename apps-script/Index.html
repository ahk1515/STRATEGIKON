<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>STRATEGIKON LPM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Source+Sans+3:wght@400;600;700&family=Stardos+Stencil:wght@700&display=swap">
<style>
/* Style de cabinet ministériel : papier, bleu marine, filet tricolore discret.
   Les chiffres en colonnes alignées, comme un rapport annexé à la loi. */
:root {
  --nuit: #f5f4ef;          /* fond de page : papier */
  --pupitre: #ffffff;
  --panneau: #ffffff;
  --panneau-haut: #eef1f6;
  --trait: #d6dbe4;
  --texte: #161b2e;
  --sourdine: #5a6375;
  --laiton: #1b2a6b;        /* accent : bleu marine institutionnel */
  --laiton-fonce: #1b2a6b;
  --accent-doux: rgba(27, 42, 107, .07);
  --rouge: #c8102e;
  --alerte: #b3261e;
  --ok: #1d7a46;
  --attente: #a65a00;
  --terre: #5f7f3b;
  --marine: #24468f;
  --air: #3d8cc4;
  --inter: #c2701f;
  --gris: #8b919b;
  --violet: #6d52a8;
  --case-vide: #eceef3;
  --hors: #f6dada;
  --f-logo: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-titre: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-texte: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-chiffre: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--nuit); color: var(--texte); }
body { margin: 0; font: 15px/1.5 var(--f-texte); }
h1, h2, h3 { font-family: var(--f-titre); font-weight: 600; letter-spacing: .02em; margin: 0; text-wrap: balance; }
h2 { font-size: 1.55rem; }
h3 { font-family: var(--f-texte); font-size: .82rem; color: var(--sourdine); text-transform: uppercase; letter-spacing: .12em; margin: 1.5rem 0 .6rem; }
p { margin: 0; }
button { font: inherit; color: inherit; }
input, select, textarea { font: inherit; color: var(--texte); background: var(--pupitre); border: 1px solid var(--trait); border-radius: 4px; padding: .45rem .55rem; min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--laiton); outline: none; }
:focus-visible { outline: 2px solid var(--laiton); outline-offset: 2px; }
.aide { color: var(--sourdine); font-size: .9rem; max-width: 70ch; margin-top: .2rem; }
.erreur { color: var(--alerte); font-size: .9rem; min-height: 1.2em; }
.note-mode { color: var(--sourdine); font-size: .82rem; margin-top: 1rem; }
.num { font-family: var(--f-chiffre); font-variant-numeric: tabular-nums lining-nums; text-align: right; white-space: nowrap; }
.neg { color: var(--alerte); }
.pos { color: var(--ok); }

.btn-laiton, .btn-contour, .btn-lien { cursor: pointer; border-radius: 4px; font-weight: 600; }
.btn-laiton { background: var(--laiton); color: #ffffff; border: 0; padding: .65rem 1.2rem; letter-spacing: .02em; }
.btn-laiton:hover { background: #2a3d8f; }
.btn-contour { background: transparent; border: 1px solid var(--trait); padding: .5rem .9rem; }
.btn-contour:hover { border-color: var(--laiton); }
.btn-lien { background: none; border: 0; color: var(--sourdine); text-decoration: underline; text-underline-offset: 3px; padding: .3rem; }
.btn-lien:hover { color: var(--texte); }

/* ---------- Accueil ---------- */
.accueil { position: relative; min-height: 100%; overflow: hidden; }
.accueil-fond { position: absolute; inset: 0 0 auto; height: 6px; background: linear-gradient(90deg, #1b2a6b 0 33.3%, #ffffff 33.3% 66.6%, var(--rouge) 66.6%); border-bottom: 1px solid var(--trait); }
.accueil-in {
  position: relative; max-width: 980px; margin: 0 auto; padding-block: 4rem 3rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 1.2rem; justify-items: center; text-align: center;
}
.surtitre { color: var(--sourdine); text-transform: uppercase; letter-spacing: .18em; font-size: .76rem; font-weight: 600; }
.surtitre::after { content: ""; display: block; width: 3rem; height: 3px; margin: .9rem auto 0; background: linear-gradient(90deg, #1b2a6b 0 33.3%, #e3e6ec 33.3% 66.6%, var(--rouge) 66.6%); }
.logo { font-family: var(--f-logo); font-weight: 600; font-size: clamp(2.4rem, 7vw, 4.4rem); letter-spacing: .14em; line-height: 1; color: var(--texte); }
.accroche { color: var(--sourdine); max-width: 56ch; font-family: var(--f-titre); font-style: italic; font-size: 1.1rem; }
.etapes-accueil { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 1rem; width: 100%; margin-top: 1.5rem; text-align: left; }
.carte-acces { background: var(--panneau); border: 1px solid var(--trait); border-top: 3px solid var(--laiton); border-radius: 2px; box-shadow: 0 1px 3px rgba(22, 27, 46, .05); padding: 1.4rem; }
.carte-discrete { border-top-color: var(--trait); background: var(--pupitre); }
.carte-acces form { display: grid; gap: .35rem; margin-top: .8rem; }
.carte-acces label { font-size: .82rem; color: var(--sourdine); margin-top: .35rem; }
.carte-acces button { margin-top: .8rem; justify-self: start; }
.deux { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.deux > div { display: grid; gap: .35rem; }
.titre-roles { margin-top: 1.5rem; }
.titre-roles span { color: var(--laiton); }
.roles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: .6rem; width: 100%; margin: 1rem 0; text-align: left; }
.role-tuile {
  cursor: pointer; background: var(--panneau); border: 1px solid var(--trait); border-radius: 6px; padding: .8rem .9rem;
  display: grid; gap: .2rem; text-align: left; position: relative; overflow: hidden; transition: border-color .15s, transform .15s;
}
.role-tuile::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--couleur, var(--inter)); }
.role-tuile:hover { border-color: var(--laiton); box-shadow: 0 4px 14px rgba(22, 27, 46, .08); }
.role-tuile b { font-family: var(--f-titre); font-size: 1.35rem; color: var(--laiton); }
.role-tuile small { color: var(--sourdine); font-size: .78rem; line-height: 1.3; }
.role-tuile .role-mission { color: var(--sourdine); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; }

/* ---------- Poste de commandement ---------- */
.poste { box-shadow: 0 1px 0 var(--trait); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(255, 255, 255, .97); border-bottom: 1px solid var(--trait); backdrop-filter: blur(6px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--nuit); }
.poste-in, .jauges, .parcours, .scene { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.poste-in { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.25rem; padding-block: .6rem; }
.logo-petit { font-family: var(--f-logo); font-weight: 600; font-size: 1.15rem; letter-spacing: .16em; color: var(--laiton); }
.poste-partie { font-family: var(--f-titre); font-size: 1.1rem; color: var(--sourdine); margin-right: auto; }
.poste-partie::before { content: "Partie "; color: var(--sourdine); text-transform: uppercase; font-size: .75rem; letter-spacing: .14em; margin-right: .35rem; }
.insigne { cursor: pointer; display: flex; align-items: baseline; gap: .5rem; background: var(--panneau-haut); border: 1px solid var(--trait); border-radius: 4px; padding: .25rem .9rem; }
.insigne span { font-family: var(--f-titre); font-weight: 700; font-size: 1.1rem; color: var(--laiton); letter-spacing: .05em; }
.insigne small { color: var(--sourdine); font-size: .75rem; max-width: 22ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mode { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--sourdine); border: 1px solid var(--trait); border-radius: 99px; padding: .1rem .6rem; }

.jauges { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .5rem; padding-block: .1rem .7rem; }
.jauge { cursor: pointer; background: none; border: 0; padding: 0; display: grid; gap: .25rem; text-align: left; }
.jauge-tete { display: flex; justify-content: space-between; align-items: baseline; gap: .3rem; }
.jauge-an { font-family: var(--f-titre); font-weight: 600; font-size: 1rem; }
.jauge-val { font-family: var(--f-chiffre); font-size: .72rem; color: var(--sourdine); }
.jauge-barre { position: relative; height: .45rem; border-radius: 1px; background: var(--case-vide); overflow: visible; display: flex; }
.jauge-barre span { height: 100%; }

.jauge-plafond { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--texte); border-radius: 1px; }
.jauge-etat { font-size: .7rem; font-weight: 600; }
.jauge[aria-pressed="true"] .jauge-an { color: var(--laiton); }

.parcours { display: flex; gap: .25rem; overflow-x: auto; border-bottom: 1px solid var(--trait); padding-block: .35rem 0; background: var(--nuit); }
.parcours button {
  cursor: pointer; background: none; border: 0; border-bottom: 3px solid transparent; padding: .6rem .9rem; white-space: nowrap;
  font-family: var(--f-titre); font-size: 1.1rem; font-weight: 600; color: var(--sourdine); letter-spacing: .02em;
}
.parcours button b { display: inline-grid; place-items: center; width: 1.45rem; height: 1.45rem; border-radius: 50%; border: 1px solid currentColor; font-size: .8rem; margin-right: .35rem; }
.parcours button[aria-selected="true"] { color: var(--texte); border-bottom-color: var(--laiton); }
.parcours button[aria-selected="true"] b { background: var(--laiton); color: #ffffff; border-color: var(--laiton); }

.scene { max-width: 1500px; margin: 0 auto; padding-block: 1.25rem 4rem; }

/* ---------- Composer ---------- */
.vue-composer { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 1.25rem; align-items: start; }
.arsenal { background: var(--pupitre); border: 1px solid var(--trait); border-radius: 8px; position: sticky; top: 10.5rem; max-height: calc(100vh - 12rem); display: flex; flex-direction: column; }
.arsenal-tete { padding: 1rem; display: grid; gap: .6rem; border-bottom: 1px solid var(--trait); }
.filtres { display: flex; flex-wrap: wrap; gap: .35rem; }
.filtre { cursor: pointer; background: none; border: 1px solid var(--trait); border-radius: 99px; padding: .2rem .65rem; font-size: .8rem; color: var(--sourdine); }
.filtre[aria-pressed="true"] { border-color: var(--laiton); color: var(--texte); background: var(--accent-doux); }
.cartes-pions { overflow-y: auto; padding: .75rem; display: grid; gap: .5rem; }
.carte-pion {
  display: grid; grid-template-columns: auto 1fr auto; gap: .65rem; align-items: center; background: var(--panneau);
  border: 1px solid var(--trait); border-radius: 6px; padding: .55rem .6rem; text-align: left; cursor: pointer; width: 100%;
}
.carte-pion:hover { border-color: var(--laiton); }
.forme { display: grid; gap: 2px; }
.forme i { display: block; width: 8px; height: 8px; border-radius: 1px; background: var(--c); }
.carte-pion-nom { font-weight: 600; font-size: .88rem; line-height: 1.25; }
.carte-pion-info { font-size: .74rem; color: var(--sourdine); display: flex; flex-wrap: wrap; gap: .2rem .6rem; margin-top: .15rem; }
.pips { display: inline-flex; gap: 2px; vertical-align: middle; }
.pips i { width: .55rem; height: .55rem; border-radius: 50%; background: var(--inter); display: block; }
.plus { font-size: 1.3rem; color: var(--laiton); font-weight: 600; width: 1.8rem; text-align: center; }
.vide-arsenal { color: var(--sourdine); font-size: .85rem; padding: 1rem; text-align: center; }

.dossier-tete { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; align-items: flex-end; margin-bottom: 1rem; }
.dossier-tete > div:first-child { min-width: 0; flex: 1 1 300px; }
.dossier-total { display: flex; gap: 1.25rem; }
.dossier-total div { display: grid; text-align: right; }
.dossier-total b { font-family: var(--f-titre); font-size: 1.5rem; font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }
.dossier-total small { color: var(--sourdine); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; }
#fiches { display: grid; gap: .75rem; }
.fiche { background: var(--panneau); border: 1px solid var(--trait); border-left: 4px solid var(--c, var(--inter)); border-radius: 6px; padding: .9rem 1rem; display: grid; gap: .7rem; }
.fiche-tete { display: flex; flex-wrap: wrap; gap: .4rem 1rem; align-items: flex-start; }
.fiche-titre { flex: 1 1 260px; min-width: 0; display: grid; gap: .15rem; }
.fiche-type { color: var(--sourdine); font-size: .7rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 600; }
.fiche-nom { font-family: var(--f-titre); font-size: 1.3rem; font-weight: 600; line-height: 1.15; }
.fiche-nom input { width: 100%; font-family: var(--f-titre); font-size: 1.15rem; }
.fiche-sous { color: var(--sourdine); font-size: .8rem; }
.fiche-cout { text-align: right; display: grid; }
.fiche-cout b { font-family: var(--f-chiffre); font-size: 1.15rem; font-weight: 500; }
.fiche-cout small { color: var(--sourdine); font-size: .74rem; }
.suppr { cursor: pointer; background: none; border: 1px solid transparent; color: var(--sourdine); border-radius: 4px; padding: .2rem .5rem; font-size: .8rem; }
.suppr:hover { color: var(--alerte); border-color: var(--alerte); }
.fiche-reglages { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; font-size: .85rem; }
.fiche-reglages label { color: var(--sourdine); display: flex; align-items: center; gap: .4rem; }
.fiche-reglages select, .fiche-reglages input { padding: .3rem .45rem; font-size: .85rem; }
.fiche-reglages input.prix { width: 6.5rem; font-family: var(--f-chiffre); text-align: right; }
.fiche-reglages input.dor { width: 3rem; text-align: right; }
.segment { display: inline-flex; border: 1px solid var(--trait); border-radius: 4px; overflow: hidden; }
.segment button { cursor: pointer; background: none; border: 0; padding: .3rem .7rem; font-size: .82rem; color: var(--sourdine); }
.segment button[aria-pressed="true"] { background: var(--laiton); color: #ffffff; font-weight: 600; }
.calendrier { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .4rem; }
.an-case { border: 1px solid var(--trait); border-radius: 5px; padding: .35rem .3rem; display: grid; justify-items: center; gap: .15rem; background: var(--pupitre); }
.an-case.actif { border-color: var(--laiton); background: var(--accent-doux); }
.an-case small { font-family: var(--f-titre); font-size: .85rem; color: var(--sourdine); }
.an-case.actif small { color: var(--laiton); }
.pas { display: flex; align-items: center; gap: .15rem; }
.pas button { cursor: pointer; width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 1px solid var(--trait); background: none; line-height: 1; padding: 0; }
.pas button:hover { border-color: var(--laiton); }
.pas output { font-family: var(--f-chiffre); min-width: 1.3rem; text-align: center; }
.coche { cursor: pointer; width: 100%; background: none; border: 0; padding: .15rem 0; font-size: .78rem; color: var(--sourdine); }
.an-case.actif .coche { color: var(--texte); font-weight: 600; }
.fiche textarea { width: 100%; min-height: 2.3rem; resize: vertical; font-size: .85rem; }
.badge { display: inline-block; font-size: .7rem; font-weight: 600; border-radius: 99px; padding: .05rem .55rem; border: 1px solid currentColor; }
.badge-attente { color: var(--attente); }
.badge-ok { color: var(--ok); }
.badge-alerte { color: var(--alerte); }
.alerte-texte { color: var(--alerte); font-size: .8rem; }
details summary { cursor: pointer; color: var(--sourdine); font-size: .8rem; }
details p { font-size: .82rem; color: var(--sourdine); margin-top: .3rem; max-width: 70ch; }
.dossier-vide { border: 1px dashed var(--trait); border-radius: 8px; padding: 2.5rem 1.5rem; text-align: center; color: var(--sourdine); display: grid; gap: .5rem; justify-items: center; }
.dossier-vide b { font-family: var(--f-titre); font-size: 1.3rem; color: var(--texte); }

/* ---------- Table ---------- */
.table-tete { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
.annees { display: flex; gap: .35rem; flex-wrap: wrap; }
.annees button, .bascule button { cursor: pointer; background: var(--pupitre); border: 1px solid var(--trait); border-radius: 4px; padding: .35rem .8rem; font-family: var(--f-titre); font-size: 1.05rem; color: var(--sourdine); }
.annees button[aria-pressed="true"], .bascule button[aria-pressed="true"] { border-color: var(--laiton); color: var(--texte); background: var(--accent-doux); }
.bascule { display: flex; gap: .35rem; }
.bascule button { font-family: var(--f-texte); font-size: .85rem; }
.table-cadre {
  background: radial-gradient(ellipse at 50% 0%, transparent, transparent 65%), var(--pupitre);
  border: 1px solid var(--trait); border-radius: 10px; padding: 1rem; box-shadow: 0 1px 2px rgba(22, 27, 46, .06);
}
.table-releve { display: flex; flex-wrap: wrap; gap: .5rem 2rem; margin-bottom: .8rem; }
.releve { display: grid; }
.releve small { color: var(--sourdine); font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; }
.releve b { font-family: var(--f-titre); font-weight: 600; font-size: 1.4rem; font-variant-numeric: lining-nums tabular-nums; }
.defile { overflow-x: auto; }
.plateau { --case: 1.85rem; display: grid; grid-template-columns: repeat(30, var(--case)); gap: 2px; width: max-content; margin: 0 auto; }
.fond { background: var(--case-vide); border-radius: 2px; }
.fond-hors { background: var(--hors); }
.fond-horstable { background: repeating-linear-gradient(135deg, var(--hors) 0 4px, var(--case-vide) 4px 8px); }
.pion {
  position: relative; z-index: 1; border-radius: 3px; overflow: hidden; display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: .68rem; line-height: 1.1; font-weight: 600; text-align: center; padding: 2px;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12);
}
.pion span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; text-shadow: 0 1px 1px rgba(0, 0, 0, .35); }
.pion-petit { font-size: .55rem; }
.pion-50::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, transparent 0 5px, rgba(179, 38, 30, .45) 5px 8px); pointer-events: none; }
.pion-case { font-size: .55rem; }
.pion-dorese { border-radius: 50%; box-shadow: inset 0 0 0 2px var(--pupitre); }
.pion-mesure { background-image: radial-gradient(rgba(255, 255, 255, .5) 1px, transparent 1.5px) !important; background-size: 5px 5px; }
.pion-debord { outline: 2px solid var(--alerte); outline-offset: -2px; }
.pion-mien { box-shadow: 0 0 0 2px var(--texte), 0 2px 6px rgba(0, 0, 0, .3); z-index: 2; }
.legende { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; margin-top: 1rem; font-size: .8rem; color: var(--sourdine); align-items: center; }
.puce-legende { display: inline-block; vertical-align: middle; margin-right: .35rem; width: 1rem; height: 1rem; border-radius: 3px; position: relative; overflow: hidden; }

/* ---------- Arbitrage ---------- */
.arb-tete { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; align-items: flex-end; margin-bottom: 1rem; }
.actions { display: flex; gap: .5rem; flex-wrap: wrap; }
.arb-annees { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .5rem; }
.arb-an { background: var(--panneau); border: 1px solid var(--trait); border-radius: 6px; padding: .7rem .8rem; display: grid; gap: .1rem; }
.arb-an .an { font-family: var(--f-titre); font-size: 1.15rem; font-weight: 600; }
.arb-an .l { display: flex; justify-content: space-between; font-size: .8rem; color: var(--sourdine); }
.arb-an .l b { font-family: var(--f-chiffre); font-weight: 500; color: var(--texte); }
.arb-colonnes { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 1.25rem; }
.decision { background: var(--panneau); border: 1px solid var(--trait); border-left: 4px solid var(--c, var(--inter)); border-radius: 6px; padding: .7rem .85rem; display: grid; gap: .5rem; margin-bottom: .5rem; }
.decision-tete { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; }
.decision-nom { font-weight: 600; }
.decision-nom small { display: block; color: var(--sourdine); font-weight: 400; font-size: .78rem; }
.choix { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }

.puce-legende.pion-attente, .puce-legende.pion-renonce { box-shadow: inset 0 0 0 2px var(--attente); }
.puce-legende.pion-renonce { box-shadow: inset 0 0 0 2px var(--alerte); }
.note-legende { font-style: italic; }

/* ---------- Lot de conception : étapes, priorités, contraintes, financements, enveloppes, flottaison ---------- */
.parcours-barre { display: flex; align-items: stretch; gap: .5rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.parcours-barre .annees-jauges { flex: 1; padding: 0; min-width: 0; }
.etapes { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding-block: .25rem; }
.etapes button { cursor: pointer; display: flex; align-items: center; gap: .4rem; background: none; border: 1px solid transparent; border-radius: 3px; padding: .2rem .55rem; font-family: var(--f-titre); font-size: .88rem; font-weight: 600; color: var(--sourdine); white-space: nowrap; text-align: left; }
.etapes button b { display: inline-grid; place-items: center; width: 1.25rem; height: 1.25rem; border-radius: 50%; border: 1px solid currentColor; font-size: .72rem; }
.etapes button[aria-pressed="true"] { color: var(--laiton); border-color: var(--laiton); background: var(--accent-doux); }
.etapes button[aria-pressed="true"] b { background: var(--laiton); color: #fff; border-color: var(--laiton); }
@media (max-width: 760px) { .parcours-barre { flex-direction: column; gap: 0; } .etapes { flex-direction: row; } }

/* Drapeau tricolore : contrainte politique */
.drapeau { display: inline-block; width: 15px; height: 10px; vertical-align: -1px; margin-right: .3rem; background: linear-gradient(90deg, #1b2a6b 0 33.3%, #ffffff 33.3% 66.6%, var(--rouge) 66.6%); box-shadow: 0 0 0 1px rgba(0, 0, 0, .35); }
.drapeau-pion { position: absolute; left: 3px; top: 3px; margin: 0; z-index: 3; }
.pion-case .drapeau-pion { width: 11px; height: 7px; left: 1px; top: 1px; }
.drapeau-titre { margin-right: .45rem; }
.badge-politique { color: var(--laiton); }
.badge-politique .drapeau { width: 12px; height: 8px; margin-right: .3rem; }
.aide.politique { border-left: 3px solid var(--laiton); padding-left: .6rem; }

/* Part alliée ou subventionnée : hachurée, hors budget */
.part-alliee { position: absolute; right: 0; top: 0; bottom: 0; z-index: 2; pointer-events: none; border-left: 2px solid #1b2a6b;
  background: repeating-linear-gradient(135deg, rgba(255, 255, 255, .92) 0 3px, rgba(27, 42, 107, .55) 3px 5px); }
.jeton-allie { background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, .92) 0 3px, rgba(27, 42, 107, .55) 3px 5px) !important; }
.puce-legende.jeton-allie { box-shadow: inset 0 0 0 1px #1b2a6b; }
.marque-fin { position: absolute; left: 3px; bottom: 3px; z-index: 3; display: grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; background: #fff; color: #1b2a6b; box-shadow: 0 0 0 1px #1b2a6b; }
.marque-fin svg { width: 11px; height: 11px; }
.marque-fin b { font-size: .5rem; letter-spacing: 0; }
.marque-proposee { box-shadow: 0 0 0 1px #1b2a6b; opacity: .6; border: 1px dashed #1b2a6b; }
.pion-defection { outline: 2px dashed var(--alerte); outline-offset: -2px; }

/* Sous la ligne de flottaison : barre rouge en pied de pion */
.pion-sous { position: relative; }
.pion-sous::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--rouge); z-index: 4; pointer-events: none; }
.puce-legende.pion-sous { box-shadow: inset 0 -4px 0 var(--rouge); }
.jeton-enveloppe { box-shadow: inset 0 0 0 2px #6d52a8 !important; }

/* Volet : blocs de conception */
.bloc-conception { border-top: 1px solid var(--trait); margin-top: .9rem; padding-top: .7rem; }
.bloc-conception h3 { margin: 0 0 .4rem; display: flex; align-items: center; }
.bloc-conception .champ { margin-top: .45rem; }
.prio-etat { display: flex; flex-wrap: wrap; gap: .35rem .9rem; align-items: baseline; font-size: .85rem; color: var(--sourdine); margin: 0; }
.prio-etat b { color: var(--texte); font-family: var(--f-titre); font-size: 1rem; }
.prio-retenue b { color: var(--laiton); }
.segment-prio button { min-width: 2.4rem; }
.propositions { list-style: none; padding: 0; margin: .5rem 0 0; display: grid; gap: .3rem; }
.propositions li { display: flex; justify-content: space-between; align-items: center; gap: .5rem; font-size: .85rem; background: var(--accent-doux); padding: .25rem .5rem; border-radius: 3px; }
.btn-mini { cursor: pointer; font-size: .75rem; border: 1px solid var(--laiton); background: var(--laiton); color: #fff; border-radius: 3px; padding: .1rem .45rem; margin-left: .25rem; }
.btn-mini-non { background: none; color: var(--laiton); }
.case-cocher { display: flex; align-items: center; gap: .35rem; font-size: .88rem; margin-top: .45rem; cursor: pointer; }
.badge-neutre { color: var(--sourdine); }
.badge-allie { color: #1b2a6b; }
.details-financement { margin-top: .5rem; font-size: .88rem; }
.details-financement summary { cursor: pointer; color: var(--laiton); }
.form-financement { display: grid; gap: .3rem; margin-top: .4rem; }
.btn-alerte { color: var(--alerte); border-color: var(--alerte); margin-top: .5rem; }
.prio-pastille { display: inline-grid; place-items: center; min-width: 1.6rem; height: 1.1rem; margin-right: .4rem; border-radius: 2px; font-size: .68rem; background: var(--laiton); color: #fff; vertical-align: 1px; }
.prio-pastille .drapeau { margin: 0; }
.prio-pastille:has(.drapeau) { background: none; }

/* Flottaison */
.flottaison { list-style: none; padding: 0; margin: .6rem 0; display: grid; gap: 2px; }
.flottaison li > button, .flot-base { width: 100%; display: grid; grid-template-columns: 2.6rem minmax(0, 1fr) auto; gap: .5rem; align-items: center; text-align: left; background: var(--panneau-haut); border: 1px solid var(--trait); border-radius: 2px; padding: .35rem .5rem; font: inherit; cursor: pointer; }
.flot-base { cursor: default; background: var(--case-vide); }
.flot-rang { font-family: var(--f-titre); font-weight: 700; color: var(--laiton); font-size: .9rem; }
.flot-nom { min-width: 0; display: grid; }
.flot-nom small, .flottaison .num small { color: var(--sourdine); font-size: .72rem; display: block; }
.flottaison .num { text-align: right; font-variant-numeric: tabular-nums; }
.flot-sous > button { border-color: rgba(200, 16, 46, .4); background: rgba(200, 16, 46, .05); box-shadow: inset 3px 0 0 var(--rouge); }
.flot-ligne { position: relative; margin: .45rem 0; height: 0; border-top: 2px solid var(--rouge); }
.flot-ligne span { position: absolute; right: 0; top: -.75rem; background: var(--rouge); color: #fff; font-size: .7rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: .1rem .45rem; border-radius: 2px; }

/* Enveloppes */
.enveloppe { border-top: 1px solid var(--trait); padding-top: .6rem; margin-top: .6rem; }
.env-barre { position: relative; height: 10px; background: var(--case-vide); margin: .3rem 0; display: flex; }
.env-plein { background: #6d52a8; }
.env-trop { background: repeating-linear-gradient(135deg, var(--rouge) 0 3px, rgba(200, 16, 46, .45) 3px 6px); }
.env-barre i { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--texte); }
.env-deborde button { box-shadow: inset 3px 0 0 var(--rouge); }
.enveloppes-reglage { display: grid; gap: .4rem; }
.env-ligne { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr) 5.5rem auto; gap: .35rem; align-items: center; }

/* Trajectoire */
.defile-x { overflow-x: auto; }
.tableau-trajectoire { font-size: .8rem; }
.tableau-trajectoire th, .tableau-trajectoire td { padding: .25rem .3rem; }
.traj-nom { min-width: 9rem; }
.traj-nom .btn-lien { text-align: left; padding: 0; font-weight: 600; }
.traj-nom small { display: block; color: var(--sourdine); font-size: .7rem; }
.traj-on { background: var(--accent-doux); }
.traj-hors td { color: var(--sourdine); }
.traj-marge td { border-top: 2px solid var(--texte); font-weight: 600; }
.liste-reglage { list-style: none; padding: 0; display: grid; gap: .3rem; }
.liste-reglage li { display: flex; justify-content: space-between; gap: .5rem; align-items: center; font-size: .85rem; }
.portee-cible { border-left: 3px solid var(--laiton); padding-left: .6rem; }
.trajectoire { list-style: none; padding: 0; margin: .8rem 0; display: grid; gap: 4px; }
.trajectoire li { display: grid; gap: .25rem; border: 1px solid var(--trait); border-radius: 2px; padding: .4rem .5rem; background: var(--panneau-haut); }
.trajectoire .traj-tete, .trajectoire .traj-marge { background: none; border: 0; padding: .1rem .5rem; font-size: .75rem; color: var(--sourdine); }
.trajectoire .traj-marge { border-top: 2px solid var(--texte); border-radius: 0; font-weight: 600; color: var(--texte); }
.traj-nom { display: grid; gap: .15rem; }
.traj-nom select { font-size: .8rem; padding: .15rem .3rem; justify-self: start; }
.traj-bande { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px; font-size: .74rem; font-variant-numeric: tabular-nums; text-align: center; }
.traj-bande span { background: var(--case-vide); padding: .1rem 0; min-height: 1.2rem; }
.traj-bande span.traj-on { background: var(--laiton); color: #fff; font-weight: 600; }
.traj-entete span, .traj-marge .traj-bande span { background: none; }
.trajectoire li.traj-hors { opacity: .7; border-style: dashed; }
.details-regles { margin: .6rem 0 1rem; font-size: .86rem; }
.details-regles summary { cursor: pointer; color: var(--laiton); font-weight: 600; }
.regles { list-style: none; padding: 0; margin: .4rem 0 0; display: grid; gap: .45rem; max-height: 22rem; overflow-y: auto; }
.regles li { display: grid; gap: .15rem; border-left: 3px solid var(--trait); padding-left: .5rem; }
.regles small { color: var(--sourdine); font-size: .72rem; }
.regle-tete { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }
.regle-blocage { color: var(--alerte); }
.regle-alerte { color: var(--attente); }
.regle-surcotautomatique { color: #6d52a8; }
.regle-drapeau { color: var(--laiton); }
.marque-alerte { position: absolute; left: 3px; top: 3px; z-index: 5; display: grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; background: #e8a200; color: #111; font: 700 .62rem/1 var(--f-texte); box-shadow: 0 0 0 1px #111; }
.drapeau-pion ~ .marque-alerte { left: 21px; }
.pion-case .marque-alerte { width: 11px; height: 11px; left: auto; right: 1px; top: 1px; font-size: .5rem; }
.alertes { list-style: none; padding: 0; margin: .4rem 0 0; display: grid; gap: .45rem; }
.alertes li { display: grid; gap: .15rem; border-left: 3px solid #e8a200; padding-left: .5rem; font-size: .85rem; }
.alertes li.alerte-info { border-left-color: var(--trait); }
.alertes small { color: var(--sourdine); font-size: .72rem; }
.alertes .btn-lien { padding: 0; font-size: .78rem; }
.liste-demande .num .badge { margin-left: .25rem; }
.puce-alerte { display: inline-grid !important; place-items: center; border-radius: 50%; background: #e8a200; color: #111; font-size: .6rem; font-weight: 700; }
/* Échanges et comparaison */
.export-boutons { display: flex; gap: .4rem; margin-top: .4rem; }
.export-boutons button { padding: .4rem .9rem; }
.cmp-resume { padding-left: 1.1rem; margin: .5rem 0; font-size: .85rem; display: grid; gap: .2rem; }
.comparaison { position: fixed; inset: 0; z-index: 50; background: rgba(20, 24, 40, .45); display: grid; place-items: start center; overflow-y: auto; padding: 24px 16px; }
.comparaison-in { width: min(1200px, 100%); background: var(--panneau); border-top: 3px solid var(--laiton); padding: 1.2rem; box-shadow: 0 10px 40px rgba(0, 0, 0, .25); }
.comparaison-tete { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.cmp-ligne { display: grid; grid-template-columns: minmax(10rem, 1.2fr) 1fr 1fr; gap: .8rem; align-items: center; padding: .3rem 0; border-bottom: 1px solid var(--trait); }
.cmp-tete { font-size: .78rem; color: var(--sourdine); border-bottom: 2px solid var(--texte); }
.cmp-cell { display: grid; gap: .2rem; }
.cmp-cell small { font-size: .75rem; font-weight: 600; }
.cmp-nom { display: grid; min-width: 0; font-size: .85rem; }
.cmp-nom small { color: var(--sourdine); font-size: .72rem; }
.cmp-diff { background: rgba(232, 162, 0, .07); }
.comparaison .mini-tableau { max-width: 30rem; }
@media (max-width: 760px) { .cmp-ligne { grid-template-columns: 1fr; gap: .3rem; } }
/* Table commune : porteur, points chauds, avis, souveraineté */
.fig-bande { gap: 3px; }
.porteur { flex: none; font: 700 .5rem/1 var(--f-texte); letter-spacing: .02em; background: rgba(255, 255, 255, .92); color: #1a1a1a; padding: 1px 3px; border-radius: 2px; }
.fig-mini .porteur { display: none; }
.pion-chaud { outline: 3px solid #e8a200 !important; outline-offset: 0; box-shadow: 0 0 0 5px rgba(232, 162, 0, .28), 0 1px 2px rgba(0, 0, 0, .35) !important; z-index: 2; }
.puce-legende.pion-chaud { outline: 2px solid #e8a200 !important; box-shadow: none !important; }
.badge-chaud { color: #8a5a00; background: rgba(232, 162, 0, .15); }
.chaud-raisons { font-size: .82rem; background: rgba(232, 162, 0, .12); border-left: 3px solid #e8a200; padding: .3rem .5rem; margin: 0 0 .5rem; }
.avis-liste { list-style: none; padding: 0; margin: 0 0 .5rem; display: grid; gap: .3rem; }
.avis-liste li { display: grid; gap: .1rem; font-size: .84rem; border-left: 3px solid var(--trait); padding-left: .5rem; }
.avis-tete { display: flex; gap: .5rem; align-items: baseline; }
.avis-tete b { font-family: var(--f-titre); color: var(--laiton); min-width: 3.4rem; }
.avis-texte { color: var(--sourdine); font-size: .78rem; }
.avis-favorable, .avis-soutenable { border-left-color: var(--ok) !important; }
.avis-reserve, .avis-fragile, .avis-report, .avis-mutualisation, .avis-alternative { border-left-color: #e8a200 !important; }
.avis-defavorable, .avis-refus, .avis-insoutenable { border-left-color: var(--alerte) !important; }
.segment-avis { flex-wrap: wrap; }
.segment-avis button { font-size: .76rem; padding: .25rem .5rem; }
.segment-avis button[data-avis="defavorable"][aria-pressed="true"], .segment-avis button[data-avis="refus"][aria-pressed="true"], .segment-avis button[data-avis="insoutenable"][aria-pressed="true"] { background: var(--alerte); }
.segment-avis button[data-avis="favorable"][aria-pressed="true"], .segment-avis button[data-avis="soutenable"][aria-pressed="true"] { background: var(--ok); }
.bloc-avis .champ input { margin-top: .3rem; font-size: .82rem; }
.souverainete { font-size: .84rem; margin: .45rem 0; padding: .3rem .5rem; border-left: 3px solid var(--ok); background: var(--accent-doux); }
.souv-partage { border-left-color: #1b2a6b; }
.souv-hors_ue, .souv-mixte { border-left-color: var(--rouge); }
.souv-finance_ue { border-left-color: #6d52a8; }
.marque-horsue { color: var(--rouge); box-shadow: 0 0 0 1px var(--rouge); }
.souv-bande span { background: var(--accent-doux); font-weight: 600; }
/* Table en paquets : un bloc par entité */
.zone-entite { position: relative; z-index: 0; pointer-events: none; background: color-mix(in srgb, var(--c) 7%, transparent); outline: 2px solid color-mix(in srgb, var(--c) 55%, transparent); outline-offset: 1px; }
.zone-mienne { outline-width: 3px; outline-color: var(--c); }
.zone-entite-titre { position: relative; z-index: 2; pointer-events: none; display: flex; align-items: center; padding-left: 3px; min-width: 0; }
.zone-entite-titre span { background: var(--c); color: #fff; font-size: .68rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: .1rem .45rem; border-radius: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.chaud-raisons.force { border-left-color: var(--alerte); background: rgba(179, 38, 30, .08); }

/* Nom des demandes en cases : étiquette posée sur la rangée de cases, les clics passent au travers. */
.etiquette-ligne { position: relative; z-index: 3; pointer-events: none; align-self: start; margin: 2px 2px 0; padding: 0 3px;
  background: color-mix(in srgb, var(--bande) 30%, #fff); color: #111; border-left: 3px solid var(--bande); border-radius: 2px; line-height: 1.25;
  font: 700 .58rem/1.25 "Source Sans 3", system-ui, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  display: flex; gap: 3px; align-items: baseline; }
.etiquette-ligne b { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.etiquette-ligne small { font-weight: 600; opacity: .75; flex: none; }
.etiquette-courte small { display: none; }
@media (max-width: 640px) { .etiquette-ligne { font-size: .5rem; } }

/* Cycle de vie, COCA / Red team, contrats opérationnels */
.marque-durci { position: absolute; right: 2px; bottom: 2px; z-index: 2; font: 700 .55rem/1 "Source Sans 3", system-ui, sans-serif; background: #111; color: #fff; padding: 1px 3px; border-radius: 2px; }
.pion-durci { box-shadow: inset 0 0 0 2px #111; }
.durcir-types, .durcir-reglage { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.durcir-type { display: inline-flex; gap: 4px; align-items: center; }
.badge-coca { background: #7a1f2b; color: #fff; }
.bloc-coca input { width: 100%; margin-top: 6px; }
.contrats, .scenarios { list-style: none; padding: 0; margin: 6px 0; display: grid; gap: 6px; }
.contrat { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 6px 8px; border-left: 4px solid var(--trait, #ccc); background: var(--carte, #fff); }
.contrat span { display: grid; min-width: 0; }
.contrat small { color: var(--encre-douce, #666); }
.contrat-li-tenu { border-left-color: #2e7d32; }
.contrat-li-partiel { border-left-color: #c58a00; }
.contrat-li-non_tenu { border-left-color: #b3261e; }
.contrat-tenu { background: #2e7d32; color: #fff; }
.contrat-partiel { background: #c58a00; color: #fff; }
.contrat-non_tenu { background: #b3261e; color: #fff; }
.scenario { padding: 6px 8px; background: var(--carte, #fff); border-left: 4px solid #999; display: grid; gap: 4px; }
.scenario-satisfaisant { border-left-color: #2e7d32; }
.scenario-partiel { border-left-color: #c58a00; }
.scenario-insuffisant { border-left-color: #b3261e; }
.scenario-ligne { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.scenario-ligne input, .scenario-ligne select { min-width: 0; }
.bloc-alea { border-left: 4px solid #b3261e; padding-left: 10px; }

/* Conquêtes hors table et budget piloté */
.conquete { border: 2px dashed #8a2d3b; background: repeating-linear-gradient(135deg, rgba(138,45,59,.05) 0 6px, transparent 6px 12px); position: relative; z-index: 1; pointer-events: none; }
.conquete-acquise { border-style: solid; border-color: #2e7d32; background: rgba(46,125,50,.08); }
.conquete-titre { position: absolute; left: 6px; top: 4px; font: 700 .7rem/1.2 "Source Sans 3", system-ui, sans-serif; text-transform: uppercase; letter-spacing: .04em; background: #8a2d3b; color: #fff; padding: 2px 6px; border-radius: 2px; }
.conquete-acquise .conquete-titre { background: #2e7d32; }
.budget-annees input[type=number] { width: 5.2rem; }
.budget-annees td, .budget-annees th { padding: 2px 4px; font-size: .8rem; }
.form-reglages { overflow-x: auto; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0 12px; }
.fond-conquete { background: #f1efe9; }
/* Réglages : pions de la table modifiés pour la partie (animateur) */
.pions-partie { margin: .6rem 0 1rem; }
.pions-partie > summary { cursor: pointer; font-weight: 600; padding: .3rem 0; }
.pions-partie input[type=search] { width: 100%; margin: .3rem 0 .5rem; }
.pions-liste { display: grid; gap: .3rem; max-height: 26rem; overflow-y: auto; }
.pion-reglage { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr) 5.5rem; gap: .2rem .4rem; align-items: center; font-size: .85rem; padding: .25rem .3rem; border-left: 3px solid transparent; }
.pion-reglage input { min-width: 0; width: 100%; }
.pion-reglage small, .pion-reglage .btn-lien { grid-column: 2 / 4; color: var(--texte-doux, #666); }
.pion-reglage-arm { font-size: .75rem; color: var(--texte-doux, #666); }
.pion-modifie { border-left-color: var(--laiton, #b08d3c); background: rgba(176, 141, 60, .08); }

/* Trajectoire de référence affichée sur la table (lecture seule) */
.bascule-ref { margin-left: .8rem; align-self: center; }
body.en-reference .zone-table { box-shadow: inset 0 0 0 3px var(--laiton, #b08d3c); }
body.en-reference #consigne { background: rgba(176, 141, 60, .12); border-left: 4px solid var(--laiton, #b08d3c); padding: .35rem .6rem; font-weight: 600; }
body.en-reference .zone-table-tete::before { content: "RÉFÉRENCE · lecture seule"; display: block; font-size: .75rem; letter-spacing: .08em; font-weight: 700; color: var(--laiton, #b08d3c); margin-bottom: .3rem; width: 100%; }
#filtre-role { align-self: center; font-size: .85rem; padding: .3rem .4rem; max-width: 12rem; }
.tableau-acteurs td, .tableau-acteurs th { white-space: nowrap; font-size: .82rem; }
.comparaison .tableau-acteurs, .comparaison .tableau-entrees { width: 100%; max-width: none; margin-bottom: .8rem; }
.tableau-entrees td:first-child { white-space: nowrap; width: 6rem; }
.tableau-entrees td + td { width: 47%; }
.tableau-entrees td { font-size: .8rem; vertical-align: top; }
.champ-ligne { display: flex; gap: .5rem; align-items: center; margin: .3rem 0 .5rem; }
.cmp-defile { overflow-x: auto; max-width: 100%; }

</style>
</head>
<body>

<!-- ===== Accueil : partie, rôle, table ===== -->
<section id="ecran-accueil" class="seuil">
  <div class="seuil-carte">
    <p class="surtitre">École de guerre · LPM 2027-2032</p>
    <h1 class="logo">STRATEGIKON</h1>

    <form id="form-rejoindre" class="seuil-form" autocomplete="off">
      <label for="rej-partie">Partie</label>
      <select id="rej-partie" required></select>
      <label for="rej-mdp">Mot de passe</label>
      <input id="rej-mdp" type="password" required>
      <button class="btn-laiton" type="submit">Entrer</button>
      <p class="erreur" id="rej-erreur" role="alert"></p>
      <button class="btn-lien" id="btn-montrer-creer" type="button">Ouvrir une nouvelle partie</button>
    </form>

    <form id="form-creer" class="seuil-form" autocomplete="off" hidden>
      <label for="cre-nom">Nom de la nouvelle partie</label>
      <input id="cre-nom" placeholder="Bageia 5" maxlength="80" required>
      <label for="cre-mdp">Mot de passe</label>
      <input id="cre-mdp" type="password" minlength="4" required>
      <label for="cre-mdp2">Confirmation</label>
      <input id="cre-mdp2" type="password" minlength="4" required>
      <button class="btn-laiton" type="submit">Ouvrir la partie</button>
      <p class="erreur" id="cre-erreur" role="alert"></p>
      <button class="btn-lien" id="btn-montrer-rejoindre" type="button">Revenir à la liste des parties</button>
    </form>

    <div id="etape-role" hidden>
      <p class="seuil-q">Votre rôle dans <b id="nom-partie-role"></b></p>
      <div class="liste-roles" id="grille-roles"></div>
      <button class="btn-lien" id="btn-retour-partie" type="button">Changer de partie</button>
    </div>
  </div>
  <p class="note-mode" id="note-mode"></p>
</section>

<!-- ===== La table ===== -->
<section id="ecran-partie" hidden>
  <header class="bandeau">
    <div class="bandeau-in">
      <span class="logo-petit">STRATEGIKON</span>
      <span class="poste-partie" id="poste-partie"></span>
      <button class="insigne" id="btn-role" type="button" title="Changer de rôle"><span id="insigne-code"></span><small id="insigne-nom"></small></button>
      <button class="btn-lien" id="btn-quitter" type="button">Quitter</button>
    </div>
    <div class="parcours-barre">
      <div class="etapes" id="parcours" role="group" aria-label="Étape du parcours"></div>
      <div class="annees-jauges" id="jauges" role="tablist" aria-label="Année"></div>
    </div>
  </header>

  <main class="atelier">
    <section class="zone-table" aria-label="Table budgétaire">
      <div class="zone-table-tete">
        <div class="table-releve" id="table-releve"></div>
        <div class="bascules">
          <div class="bascule" role="group" aria-label="Pions affichés">
            <button type="button" data-filtre="tout" aria-pressed="true">Toute la table</button>
            <button type="button" data-filtre="mien" aria-pressed="false">Ma demande</button>
            <button type="button" data-filtre="chaud" aria-pressed="false">Où faut-il arbitrer ?</button>
          </div>
          <div class="bascule" role="group" aria-label="Vue">
            <button type="button" data-vue="demandes" aria-pressed="true">Demandes</button>
            <button type="button" data-vue="arbitrage" aria-pressed="false">Après arbitrage</button>
          </div>
        </div>
      </div>
      <p class="consigne" id="consigne"></p>
      <div class="defile"><div class="plateau" id="plateau"></div></div>
      <div class="hors-table" id="hors-table"></div>
      <div class="legende" id="legende"></div>
    </section>

    <aside class="volet" aria-label="Panneau">
      <nav class="volet-onglets" id="volet-onglets" role="tablist"></nav>
      <div class="volet-corps" id="volet"></div>
    </aside>
  </main>
</section>

<div class="toast" id="toast" role="status" hidden></div>

  var TYPES_LIGNE = {

      table: 600, // cases par année (60 Md€)
      plafonds: { 2027: 590, 2028: 580, 2029: 570, 2030: 590, 2031: 590, 2032: 590 }, // cases

  // Scénarios d'inflation du MEFR (MEFR-03) : perte de pouvoir d'achat en M€ par an, déclenchée par l'animateur.
  var SCENARIOS_INFLATION = {
    stabilisation: { nom: "Stabilisation européenne", montant: 850 },
    conflit: { nom: "Conflit régional prolongé", montant: 1500 },
    energie: { nom: "Choc énergétique", montant: 2800 },
    otan_russie: { nom: "Guerre OTAN-Russie", montant: 4900 }

  // Plateaux hors table à conquérir : propres à chaque partie (params.conquetes), aucun par défaut.
  // Relevé de la table 2032 de la maquette du 25/11, proposé à l'animateur comme point de départ.
  var CONQUETES_RELEVE_2032 = [

  function conquetesDe(params) {
    var c = (params || {}).conquetes;

  }
  function conquisDe(params, annee) {
    return conquetesDe(params).reduce(function (t, x) { return t + (x.annees.indexOf(annee) !== -1 ? x.montant : 0); }, 0);

  function carburantsDe(params, annee) { return Math.max(0, Number((((params || {}).carburants) || {})[annee]) || 0); }

    var i = (params || {}).inflation;

  // Plafond effectif d'une année, en M€ : plafond fixé moins l'inflation.
  function plafondMontant(params, annee) {
    return (Number(((params || {}).plafonds || {})[annee]) || 0) * CASE - inflationDe(params, annee) + conquisDe(params, annee);

  function indexPions(pions) {

  // Situation de départ (photo 2027) : DORESE déjà posées sur chaque capacité du socle.

  // Le socle : ce qui est posé d'office chaque année (gris, violets, capacités à 50 %,

  // Coût unitaire d'une ligne (M€) et DORESE unitaires.
  function unitaire(ligne, idx) {
    var pion = idx[ligne.pion];
    var vide = { cout: 0, dorese: { ao: 0, mco: 0, rh: 0 } };
    switch (ligne.type) {

      case "ajout":

  // Coût d'une ligne par année : { 2027: {cout, dorese:{ao,mco,rh}}, ..., total }
  function coutLigne(ligne, idx) {

    ANNEES.forEach(function (a) {

  // Programme en tranches placé sur la trajectoire : montant fixé année par année.
  function coutFixe(ligne, a) {

    return Number(c[a]) || 0;

  function armeeDeLigne(ligne, idx) {

  // Synthèse d'une partie, année par année.

  function synthese(pions, lignes, params, filtre) {
    var idx = indexPions(pions);

      var socle = zeroArmees();

        var f = financements(l, idx, params)[a];

        if (et.depassement > 0) {

        totalSocle: totalSocle,

        total: total,
        plafond: plafond,
        table: (Number(params.table) || 600) * CASE,

  }

  function somme(o) {
    return Object.keys(o).reduce(function (s, k) { return s + o[k]; }, 0);
  }

  // Remplissage de la grille d'une année : renvoie une liste de blocs
  // { armee, nature: 'gris'|'violet'|'orange'|'capacite'|'dorese'|'libre'|'retrait', libelle, cases }
  // dans l'ordre de pose. Les DORESE suivent immédiatement leur capacité (règle « Au contact »).
  function blocsAnnee(pions, lignes, params, annee) {
    var idx = indexPions(pions);
    var blocs = [];
    var retires = {};

    lignes.forEach(function (l) {
      var q = quantite(l, annee);

      if (l.type === "dorese") passes100[l.pion] = l;
      if (l.type === "degrade") degrades[l.pion] = l;

    socle.forEach(function (p) {

      if (passes100[p.id] && nbManquantes(p)) {

      }
    });
    lignes.forEach(function (l) {
      var q = quantite(l, annee);

          if (Number(l.niveau) === 100 && nbDorese(p)) {

          }

      }
    });

  }


  // ---------- Placement sur la table (grille de 30 colonnes) ----------
  // Pose les pions avec leur forme réelle, groupe par groupe (dépenses fixes, puis chaque armée).
  // Pions rigides : socle et pions ajoutés (largeur x hauteur, rotation permise).
  // Les DORESE d'une capacité à 100 % sont posées au contact de la capacité.

  var ORDRE_ZONES = ["Terre", "Marine", "Air et Espace", "Interarmées", "DGA", "International", "SGA", "MEFR", "MINARM", "Fixes"];
  var ENTITE_DU_ROLE = { EMAT: "Terre", EMM: "Marine", EMAAE: "Air et Espace", DGA: "DGA", DGRIS: "International", MEAE: "International",
    SGA: "SGA", MEFR: "MEFR", MINARM: "MINARM", COCA: "Interarmées", "SC-Plans": "Interarmées", CEMA: "Interarmées", Animateur: "Interarmées" };

  function Plateau(lignesInit, largeur) {

  // filtreSocle(pion) -> bool (facultatif) : ne pose que ces pions du socle (vue « ma demande »).

  function placerAnnee(pions, lignes, params, annee, filtreSocle, options) {
    options = options || {};

    var pieces = [];
    var retires = {}, passes100 = {}, degrades = {}, durcis = {};
    lignes.forEach(function (l) {

      if (l.type === "retrait") retires[l.pion] = true;
      if (l.type === "dorese") passes100[l.pion] = l;

      var dg = degrades[p.id] && !passes100[p.id] ? degrades[p.id] : null;

      var plein = types.length >= nbDorese(p);

      var sources = (l100 ? typesDorese(doreseManquantes(p)) : []).map(function () { return { ligne: l100.id, role: l100.role, statut: statutDe(l100) }; });
      var ld = durcis[p.id] && !dg ? durcis[p.id] : null;

        libelle: p.nom, niveau: plein ? 100 : 50, dorese: types.length, types: types, socle: true,
        nDepart: dg ? 0 : nbDepart(p), ligneDorese: l100 ? l100.id : null, roleDorese: l100 ? l100.role : null, degrade: dg ? dg.id : null,
        statutDorese: l100 ? statutDe(l100) : null, contrainte: contrainteAcquise("pion:" + p.id, params), sources: sources, durci: ld ? ld.id : null });
    });
    lignes.forEach(function (l) {

        if (n > 0) groupe(dest).secables.push({ cases: n, armee: arm, nature: "libre", libelle: l.libelle || "Ligne libre", role: l.role, ligne: l.id, horsCatalogue: !l.modele, statut: st, marques: marques });
      }
    });
    // Surcoûts carburants (MEFR-02) : posés comme une dépense fixe de l'année.
    var nCarb = Math.round(carburantsDe(params, annee) / CASE);
    if (nCarb > 0 && !filtreSocle) groupe("Fixes").secables.push({ cases: nCarb, armee: "Interarmées", nature: "libre", libelle: "Surcoût carburants (MEFR-02)", role: null, ligne: null, carburant: true, statut: null });
    // Excédent des enveloppes internes : posé comme un montant sécable, au nom de l'enveloppe.
    enveloppesDe(params).forEach(function (e) {

      var n = Math.ceil(et.depassement / CASE);

    var cellules = []; // cases isolées : DORESE et montants sécables
    var zones = [];
    function placerGroupe(plateau, nomG, r0, rMin) {

  function etalerAuto(pions, lignes, params) {

    var syn = synthese(pions, autres, params);

    var debuts = {}, horsLpm = [];

    cibles.forEach(function (l) {

  // ---------- Souveraineté ----------

<script>
// Stockage des parties. Deux modes, même interface (toutes les méthodes renvoient une Promise) :
//  - « partagé » : base Supabase (clés dans js/config.js), ou feuille Google via Apps Script ;
//  - « local »   : navigateur seul (localStorage), pour essayer l'outil sans rien installer.
// Interface : listerParties, creerPartie, ouvrirPartie, lireEtat, majParams, ecrireLigne, supprimerLigne.
(function (racine) {
  "use strict";

  var CONFIG = racine.STRAT_CONFIG || {};

  // ---------- Mode partagé : Google Sheets via Apps Script ----------
  // Page servie par Apps Script : on passe par google.script.run.
  // Page hébergée ailleurs : on appelle l'URL du script (config.appsScriptUrl) en POST.
  function Partage(url) {
    this.mode = "partage";
    this.url = url || "";
  }
  Partage.prototype.appel = function (action, args) {
    var url = this.url;
    if (racine.google && racine.google.script && racine.google.script.run) {
      return new Promise(function (ok, ko) {
        racine.google.script.run
          .withSuccessHandler(function (r) { ok(JSON.parse(r)); })
          .withFailureHandler(function (e) { ko(new Error(String((e && e.message) || e).replace(/^Error:\s*/, ""))); })
          .appeler(action, args || {});
      });
    }
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: action, args: args || {} })
    }).then(function (r) { return r.json(); }).then(function (r) {
      if (!r.ok) throw new Error(r.erreur || "Erreur du serveur");
      return r.resultat;
    });
  };
  Partage.prototype.listerParties = function () { return this.appel("listerParties"); };
  Partage.prototype.creerPartie = function (nom, mdp, params) { return this.appel("creerPartie", { nom: nom, mdp: mdp, params: params }); };
  Partage.prototype.ouvrirPartie = function (nom, mdp) { return this.appel("ouvrirPartie", { nom: nom, mdp: mdp }); };
  Partage.prototype.lireEtat = function (nom, mdp) { return this.appel("lireEtat", { nom: nom, mdp: mdp }); };
  Partage.prototype.majParams = function (nom, mdp, params) { return this.appel("majParams", { nom: nom, mdp: mdp, params: params }); };
  Partage.prototype.ecrireLigne = function (nom, mdp, ligne) { return this.appel("ecrireLigne", { nom: nom, mdp: mdp, ligne: ligne }); };
  Partage.prototype.supprimerLigne = function (nom, mdp, id) { return this.appel("supprimerLigne", { nom: nom, mdp: mdp, id: id }); };

  // ---------- Mode partagé : Supabase (fonctions SQL de supabase/schema.sql) ----------
  function Supabase(url, cle) {
    this.mode = "partage";
    this.url = url.replace(/\/+$/, "");
    this.cle = cle;
  }
  Supabase.prototype.rpc = function (fonction, args) {
    var entetes = { "Content-Type": "application/json", apikey: this.cle };
    // Ancienne clé « anon » (JWT) : on la passe aussi en Authorization. Nouvelle clé sb_publishable_ : apikey seul.
    if (this.cle.indexOf("sb_") !== 0) entetes.Authorization = "Bearer " + this.cle;
    return fetch(this.url + "/rest/v1/rpc/" + fonction, {
      method: "POST", headers: entetes, body: JSON.stringify(args || {})
    }).then(function (r) {
      return r.text().then(function (t) {
        var corps = null;
        try { corps = t ? JSON.parse(t) : null; } catch (e) { corps = { message: t }; }
        if (!r.ok) throw new Error((corps && corps.message) || "Erreur du serveur (" + r.status + ")");
        return corps;
      });
    }, function () { throw new Error("Base injoignable : vérifiez la connexion internet."); });
  };
  Supabase.prototype.listerParties = function () { return this.rpc("lister_parties"); };
  Supabase.prototype.creerPartie = function (nom, mdp, params) { return this.rpc("creer_partie", { p_nom: nom, p_mdp: mdp, p_params: params }); };
  Supabase.prototype.ouvrirPartie = function (nom, mdp) { return this.rpc("ouvrir_partie", { p_nom: nom, p_mdp: mdp }); };
  Supabase.prototype.lireEtat = function (nom, mdp) { return this.rpc("lire_etat", { p_nom: nom, p_mdp: mdp }); };
  Supabase.prototype.majParams = function (nom, mdp, params) { return this.rpc("maj_params", { p_nom: nom, p_mdp: mdp, p_params: params }); };
  Supabase.prototype.ecrireLigne = function (nom, mdp, ligne) { return this.rpc("ecrire_ligne", { p_nom: nom, p_mdp: mdp, p_ligne: ligne }); };
  Supabase.prototype.supprimerLigne = function (nom, mdp, id) { return this.rpc("supprimer_ligne", { p_nom: nom, p_mdp: mdp, p_id: id }); };

  // ---------- Mode local (un seul navigateur) ----------
  var CLE_LOCALE = "strategikon.v1";

  function Local() { this.mode = "local"; }
  Local.prototype.lire = function () {
    try { return JSON.parse(localStorage.getItem(CLE_LOCALE)) || { parties: {} }; }
    catch (e) { return memoire; }
  };
  var memoire = { parties: {} };
  Local.prototype.ecrire = function (etat) {
    memoire = etat;
    try { localStorage.setItem(CLE_LOCALE, JSON.stringify(etat)); } catch (e) { /* stockage refusé : on garde en mémoire */ }
  };
  function cleNom(nom) { return String(nom || "").trim().toLowerCase(); }
  function hacher(texte) {
    if (racine.crypto && racine.crypto.subtle && racine.TextEncoder) {
      return racine.crypto.subtle.digest("SHA-256", new TextEncoder().encode(texte)).then(function (buf) {
        return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
      });
    }
    var h = 0;
    for (var i = 0; i < texte.length; i++) h = (h * 31 + texte.charCodeAt(i)) | 0;
    return Promise.resolve("simple-" + h);
  }
  Local.prototype.verifier = function (nom, mdp) {
    var etat = this.lire();
    var p = etat.parties[cleNom(nom)];
    if (!p) return Promise.reject(new Error("Partie introuvable"));
    return hacher(p.sel + mdp).then(function (h) {
      if (h !== p.mdp_hash) throw new Error("Mot de passe incorrect");
      return { etat: etat, partie: p };
    });
  };
  Local.prototype.listerParties = function () {
    var etat = this.lire();
    return Promise.resolve(Object.keys(etat.parties).map(function (k) {
      return { nom: etat.parties[k].nom, cree_le: etat.parties[k].cree_le };
    }).sort(function (a, b) { return a.cree_le < b.cree_le ? 1 : -1; }));
  };
  Local.prototype.creerPartie = function (nom, mdp, params) {
    var self = this;
    nom = String(nom || "").trim();
    if (!nom) return Promise.reject(new Error("Donnez un nom à la partie"));
    if (String(mdp || "").length < 4) return Promise.reject(new Error("Le mot de passe doit faire au moins 4 caractères"));
    var etat = this.lire();
    if (etat.parties[cleNom(nom)]) return Promise.reject(new Error("Une partie porte déjà ce nom"));
    var sel = Math.random().toString(36).slice(2);
    return hacher(sel + mdp).then(function (h) {
      var p = { id: "local-" + Date.now(), nom: nom, sel: sel, mdp_hash: h, params: params, cree_le: new Date().toISOString(), lignes: {} };
      etat.parties[cleNom(nom)] = p;
      self.ecrire(etat);
      return { id: p.id, nom: p.nom, params: p.params, cree_le: p.cree_le };
    });
  };
  Local.prototype.ouvrirPartie = function (nom, mdp) {
    return this.verifier(nom, mdp).then(function (r) {
      return { id: r.partie.id, nom: r.partie.nom, params: r.partie.params, cree_le: r.partie.cree_le };
    });
  };
  Local.prototype.majParams = function (nom, mdp, params) {
    var self = this;
    return this.verifier(nom, mdp).then(function (r) { r.partie.params = params; self.ecrire(r.etat); });
  };
  Local.prototype.lireEtat = function (nom, mdp) {
    return this.verifier(nom, mdp).then(function (r) {
      return {
        partie: { id: r.partie.id, nom: r.partie.nom, params: r.partie.params, cree_le: r.partie.cree_le },
        lignes: Object.keys(r.partie.lignes).map(function (k) { return JSON.parse(JSON.stringify(r.partie.lignes[k])); })
      };
    });
  };
  Local.prototype.ecrireLigne = function (nom, mdp, ligne) {
    var self = this;
    return this.verifier(nom, mdp).then(function (r) {
      var existante = r.partie.lignes[ligne.id];
      var l = JSON.parse(JSON.stringify(ligne));
      l.maj_le = existante ? existante.maj_le : new Date().toISOString();
      r.partie.lignes[ligne.id] = l;
      self.ecrire(r.etat);
    });
  };
  Local.prototype.supprimerLigne = function (nom, mdp, id) {
    var self = this;
    return this.verifier(nom, mdp).then(function (r) { delete r.partie.lignes[id]; self.ecrire(r.etat); });
  };

  var dansAppsScript = !!(racine.google && racine.google.script && racine.google.script.run);
  racine.STRAT_STOCKAGE = dansAppsScript ? new Partage("")
    : (CONFIG.supabaseUrl && CONFIG.supabaseCle) ? new Supabase(CONFIG.supabaseUrl, CONFIG.supabaseCle)
    : CONFIG.appsScriptUrl ? new Partage(CONFIG.appsScriptUrl)
    : new Local();
})(window);

</script>

        var c = l && l.decision.statut !== "renonce" && l.annees[a] ? l.annees[a].cout : 0;
        return el("span", { classe: c ? "traj-on" : "", texte: c ? n1(c) : "" });
      }));
    }
    function jauge(s) {
      var max = Math.max(s.plafond || 1, s.total || 0);
      return el("span", { classe: "mini-barre" }, [el("span", { style: "width:" + (100 * (s.total || 0) / max) + "%", classe: (s.marge || 0) < 0 ? "trop" : "" }), el("i", { style: "left:" + (100 * (s.plafond || 0) / max) + "%" })]);
    }
    var tete = el("div", { classe: "cmp-ligne cmp-tete" }, [el("span", { texte: "" }), el("b", { texte: "Joueurs" }), el("b", { texte: "Référence" })]);
    var annees = el("div", { classe: "cmp-annees" }, cmp.annees.map(function (a) {
      return el("div", { classe: "cmp-ligne" }, [el("b", { texte: String(a.annee) }),
        el("span", { classe: "cmp-cell" }, [jauge(a.joueurs), el("small", { classe: (a.joueurs.marge || 0) < 0 ? "neg" : "pos", texte: n1(a.joueurs.total || 0) + " Md€ · " + ((a.joueurs.marge || 0) < 0 ? "dépasse de " : "marge ") + n1(Math.abs(a.joueurs.marge || 0)) })]),
        el("span", { classe: "cmp-cell" }, [jauge(a.reference), el("small", { classe: (a.reference.marge || 0) < 0 ? "neg" : "pos", texte: n1(a.reference.total || 0) + " Md€ · " + ((a.reference.marge || 0) < 0 ? "dépasse de " : "marge ") + n1(Math.abs(a.reference.marge || 0)) })])]);
    }));
    var entete = el("div", { classe: "cmp-ligne cmp-tete" }, [el("span", { texte: "Ligne" }),
      el("div", { classe: "traj-bande traj-entete" }, M.ANNEES.map(function (a) { return el("span", { texte: String(a) }); })),
      el("div", { classe: "traj-bande traj-entete" }, M.ANNEES.map(function (a) { return el("span", { texte: String(a) }); }))]);
    var lignes = cmp.lignes.slice().sort(function (x, y) { return Math.abs(y.ecart_entree || 0) - Math.abs(x.ecart_entree || 0) || (x.role < y.role ? -1 : 1); });
    var corps = lignes.map(function (x) {
      var note = [];
      if (x.ecart_entree) note.push(x.ecart_entree < 0 ? "joueurs " + -x.ecart_entree + " an(s) plus tôt" : "joueurs " + x.ecart_entree + " an(s) plus tard");
      if (x.renonce_joueurs !== x.renonce_reference) note.push(x.renonce_joueurs ? "renoncée par les joueurs" : "renoncée dans la référence");
      else if (x.renonce_joueurs) note.push("renoncée des deux côtés");
      if (!x.joueurs || !x.reference) note.push(x.joueurs ? "absente de la référence" : "absente chez les joueurs");
      if (x.alertes_joueurs || x.alertes_reference) note.push("alertes " + x.alertes_joueurs + " / " + x.alertes_reference);
      return el("div", { classe: "cmp-ligne" + (note.length ? " cmp-diff" : "") }, [
        el("span", { classe: "cmp-nom" }, [el("b", { texte: x.libelle }), el("small", { texte: x.role + (note.length ? " · " + note.join(" · ") : "") })]),
        bande(x.joueurs), bande(x.reference)]);
    });
    var boite = el("section", { classe: "comparaison", id: "comparaison", role: "dialog", "aria-label": "Comparaison des trajectoires" }, [
      el("div", { classe: "comparaison-in" }, [
        el("div", { classe: "comparaison-tete" }, [el("h2", { classe: "volet-titre", texte: "Trajectoires 2027-2032 : joueurs et référence" }),
          el("button", { type: "button", classe: "btn-contour", texte: "Fermer", onclick: function () { boite.remove(); } })]),
        el("p", { classe: "aide", texte: "Montants payés par la France, en Md€, après arbitrage. Référence : " + (ref.partie || "fichier importé") + "." }),
        resumeComparaison(cmp), tete, annees,
        el("h3", { texte: "Choix annuels par acteur" }), el("label", { classe: "champ champ-ligne" }, ["Acteur", choixRole]), tableauActeurs(cmp, roleVu),
        el("h3", { texte: "Ligne par ligne" + (roleVu ? " · " + roleVu : "") }), entete].concat(corps))]);
    document.body.appendChild(boite);
  }

  // ---------- Démarrage ----------
  function demarrer() {
    $("note-mode").textContent = S.mode === "partage" ? "Base partagée : chaque pôle voit les autres avancer en quelques secondes." : "Mode local : les parties restent dans ce navigateur.";
    $("btn-montrer-creer").addEventListener("click", function () { etapeAccueil("creer"); $("cre-nom").focus(); });
    $("btn-montrer-rejoindre").addEventListener("click", function () { etapeAccueil("rejoindre"); });
    $("form-rejoindre").addEventListener("submit", function (ev) {
      ev.preventDefault();
      $("rej-erreur").textContent = "";
      var nom = $("rej-partie").value, mdp = $("rej-mdp").value;
      if (!nom) { $("rej-erreur").textContent = "Ouvrez d'abord une partie, ou demandez son nom à l'animateur."; return; }
      S.ouvrirPartie(nom, mdp).then(function (p) { montrerRoles(p, mdp); }).catch(function (e) { $("rej-erreur").textContent = e.message; });
    });
    $("form-creer").addEventListener("submit", function (ev) {
      ev.preventDefault();
      $("cre-erreur").textContent = "";
      var nom = $("cre-nom").value.trim(), mdp = $("cre-mdp").value;
      if (mdp !== $("cre-mdp2").value) { $("cre-erreur").textContent = "Les deux mots de passe diffèrent."; return; }
      S.creerPartie(nom, mdp, M.parametresParDefaut()).then(function (p) { montrerRoles(p, mdp); }).catch(function (e) { $("cre-erreur").textContent = e.message; });
    });
    $("btn-retour-partie").addEventListener("click", quitter);
    $("btn-quitter").addEventListener("click", quitter);
    $("btn-role").addEventListener("click", function () { montrerRoles(etat.partie, etat.mdp); });
    document.querySelectorAll(".bascule button[data-vue]").forEach(function (b) { b.addEventListener("click", function () { etat.vue = b.getAttribute("data-vue"); rendre(false); }); });
    document.querySelectorAll(".bascule button[data-filtre]").forEach(function (b) { b.addEventListener("click", function () { etat.filtreTable = b.getAttribute("data-filtre"); rendre(false); }); });
    setInterval(function () { if (etat.partie && etat.role && !Object.keys(enAttente).length) recharger(false); }, S.mode === "partage" ? 6000 : 5000);

    etapeAccueil("rejoindre");
    chargerParties().then(function () {
      var mem = null;
      try { mem = JSON.parse(sessionStorage.getItem(CLE_SESSION)); } catch (e) { mem = null; }
      if (mem && mem.nom && mem.role) {
        S.ouvrirPartie(mem.nom, mem.mdp).then(function (p) {
          etat.partie = p; etat.mdp = mem.mdp; if (mem.annee) etat.annee = mem.annee; if (mem.phase) etat.phase = mem.phase;
          return entrer(mem.role);
        }).catch(function () { etat.partie = null; memoriser(); });
      }
    });
  }

  demarrer();
})();

</script>
