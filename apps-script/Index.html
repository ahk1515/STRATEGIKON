<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>STRATEGIKON LPM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Source+Sans+3:wght@400;600;700&family=Stardos+Stencil:wght@700&display=swap">
<style>
/* Style de cabinet ministériel : papier, bleu marine, filet tricolore discret.
   Les chiffres en colonnes alignées, comme un rapport annexé à la loi. */
:root {
  --nuit: #f5f4ef;          /* fond de page : papier */
  --pupitre: #ffffff;
  --panneau: #ffffff;
  --panneau-haut: #eef1f6;
  --trait: #d6dbe4;
  --texte: #161b2e;
  --sourdine: #5a6375;
  --laiton: #1b2a6b;        /* accent : bleu marine institutionnel */
  --laiton-fonce: #1b2a6b;
  --accent-doux: rgba(27, 42, 107, .07);
  --rouge: #c8102e;
  --alerte: #b3261e;
  --ok: #1d7a46;
  --attente: #a65a00;
  --terre: #5f7f3b;
  --marine: #24468f;
  --air: #3d8cc4;
  --inter: #c2701f;
  --gris: #8b919b;
  --violet: #6d52a8;
  --case-vide: #eceef3;
  --hors: #f6dada;
  --f-logo: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-titre: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-texte: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-chiffre: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--nuit); color: var(--texte); }
body { margin: 0; font: 15px/1.5 var(--f-texte); }
h1, h2, h3 { font-family: var(--f-titre); font-weight: 600; letter-spacing: .02em; margin: 0; text-wrap: balance; }
h2 { font-size: 1.55rem; }
h3 { font-family: var(--f-texte); font-size: .82rem; color: var(--sourdine); text-transform: uppercase; letter-spacing: .12em; margin: 1.5rem 0 .6rem; }
p { margin: 0; }
button { font: inherit; color: inherit; }
input, select, textarea { font: inherit; color: var(--texte); background: var(--pupitre); border: 1px solid var(--trait); border-radius: 4px; padding: .45rem .55rem; min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--laiton); outline: none; }
:focus-visible { outline: 2px solid var(--laiton); outline-offset: 2px; }
.aide { color: var(--sourdine); font-size: .9rem; max-width: 70ch; margin-top: .2rem; }
.erreur { color: var(--alerte); font-size: .9rem; min-height: 1.2em; }
.note-mode { color: var(--sourdine); font-size: .82rem; margin-top: 1rem; }
.num { font-family: var(--f-chiffre); font-variant-numeric: tabular-nums lining-nums; text-align: right; white-space: nowrap; }
.neg { color: var(--alerte); }
.pos { color: var(--ok); }

.btn-laiton, .btn-contour, .btn-lien { cursor: pointer; border-radius: 4px; font-weight: 600; }
.btn-laiton { background: var(--laiton); color: #ffffff; border: 0; padding: .65rem 1.2rem; letter-spacing: .02em; }
.btn-laiton:hover { background: #2a3d8f; }
.btn-contour { background: transparent; border: 1px solid var(--trait); padding: .5rem .9rem; }
.btn-contour:hover { border-color: var(--laiton); }
.btn-lien { background: none; border: 0; color: var(--sourdine); text-decoration: underline; text-underline-offset: 3px; padding: .3rem; }
.btn-lien:hover { color: var(--texte); }

/* ---------- Accueil ---------- */
.accueil { position: relative; min-height: 100%; overflow: hidden; }
.accueil-fond { position: absolute; inset: 0 0 auto; height: 6px; background: linear-gradient(90deg, #1b2a6b 0 33.3%, #ffffff 33.3% 66.6%, var(--rouge) 66.6%); border-bottom: 1px solid var(--trait); }
.accueil-in {
  position: relative; max-width: 980px; margin: 0 auto; padding-block: 4rem 3rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 1.2rem; justify-items: center; text-align: center;
}
.surtitre { color: var(--sourdine); text-transform: uppercase; letter-spacing: .18em; font-size: .76rem; font-weight: 600; }
.surtitre::after { content: ""; display: block; width: 3rem; height: 3px; margin: .9rem auto 0; background: linear-gradient(90deg, #1b2a6b 0 33.3%, #e3e6ec 33.3% 66.6%, var(--rouge) 66.6%); }
.logo { font-family: var(--f-logo); font-weight: 600; font-size: clamp(2.4rem, 7vw, 4.4rem); letter-spacing: .14em; line-height: 1; color: var(--texte); }
.accroche { color: var(--sourdine); max-width: 56ch; font-family: var(--f-titre); font-style: italic; font-size: 1.1rem; }
.etapes-accueil { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 1rem; width: 100%; margin-top: 1.5rem; text-align: left; }
.carte-acces { background: var(--panneau); border: 1px solid var(--trait); border-top: 3px solid var(--laiton); border-radius: 2px; box-shadow: 0 1px 3px rgba(22, 27, 46, .05); padding: 1.4rem; }
.carte-discrete { border-top-color: var(--trait); background: var(--pupitre); }
.carte-acces form { display: grid; gap: .35rem; margin-top: .8rem; }
.carte-acces label { font-size: .82rem; color: var(--sourdine); margin-top: .35rem; }
.carte-acces button { margin-top: .8rem; justify-self: start; }
.deux { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.deux > div { display: grid; gap: .35rem; }
.titre-roles { margin-top: 1.5rem; }
.titre-roles span { color: var(--laiton); }
.roles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: .6rem; width: 100%; margin: 1rem 0; text-align: left; }
.role-tuile {
  cursor: pointer; background: var(--panneau); border: 1px solid var(--trait); border-radius: 6px; padding: .8rem .9rem;
  display: grid; gap: .2rem; text-align: left; position: relative; overflow: hidden; transition: border-color .15s, transform .15s;
}
.role-tuile::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--couleur, var(--inter)); }
.role-tuile:hover { border-color: var(--laiton); box-shadow: 0 4px 14px rgba(22, 27, 46, .08); }
.role-tuile b { font-family: var(--f-titre); font-size: 1.35rem; color: var(--laiton); }
.role-tuile small { color: var(--sourdine); font-size: .78rem; line-height: 1.3; }
.role-tuile .role-mission { color: var(--sourdine); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; }

/* ---------- Poste de commandement ---------- */
.poste { box-shadow: 0 1px 0 var(--trait); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(255, 255, 255, .97); border-bottom: 1px solid var(--trait); backdrop-filter: blur(6px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--nuit); }
.poste-in, .jauges, .parcours, .scene { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.poste-in { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.25rem; padding-block: .6rem; }
.logo-petit { font-family: var(--f-logo); font-weight: 600; font-size: 1.15rem; letter-spacing: .16em; color: var(--laiton); }
.poste-partie { font-family: var(--f-titre); font-size: 1.1rem; color: var(--sourdine); margin-right: auto; }
.poste-partie::before { content: "Partie "; color: var(--sourdine); text-transform: uppercase; font-size: .75rem; letter-spacing: .14em; margin-right: .35rem; }
.insigne { cursor: pointer; display: flex; align-items: baseline; gap: .5rem; background: var(--panneau-haut); border: 1px solid var(--trait); border-radius: 4px; padding: .25rem .9rem; }
.insigne span { font-family: var(--f-titre); font-weight: 700; font-size: 1.1rem; color: var(--laiton); letter-spacing: .05em; }
.insigne small { color: var(--sourdine); font-size: .75rem; max-width: 22ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mode { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--sourdine); border: 1px solid var(--trait); border-radius: 99px; padding: .1rem .6rem; }

.jauges { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .5rem; padding-block: .1rem .7rem; }
.jauge { cursor: pointer; background: none; border: 0; padding: 0; display: grid; gap: .25rem; text-align: left; }
.jauge-tete { display: flex; justify-content: space-between; align-items: baseline; gap: .3rem; }
.jauge-an { font-family: var(--f-titre); font-weight: 600; font-size: 1rem; }
.jauge-val { font-family: var(--f-chiffre); font-size: .72rem; color: var(--sourdine); }
.jauge-barre { position: relative; height: .45rem; border-radius: 1px; background: var(--case-vide); overflow: visible; display: flex; }
.jauge-barre span { height: 100%; }

.jauge-plafond { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--texte); border-radius: 1px; }
.jauge-etat { font-size: .7rem; font-weight: 600; }
.jauge[aria-pressed="true"] .jauge-an { color: var(--laiton); }

.parcours { display: flex; gap: .25rem; overflow-x: auto; border-bottom: 1px solid var(--trait); padding-block: .35rem 0; background: var(--nuit); }
.parcours button {
  cursor: pointer; background: none; border: 0; border-bottom: 3px solid transparent; padding: .6rem .9rem; white-space: nowrap;
  font-family: var(--f-titre); font-size: 1.1rem; font-weight: 600; color: var(--sourdine); letter-spacing: .02em;
}
.parcours button b { display: inline-grid; place-items: center; width: 1.45rem; height: 1.45rem; border-radius: 50%; border: 1px solid currentColor; font-size: .8rem; margin-right: .35rem; }
.parcours button[aria-selected="true"] { color: var(--texte); border-bottom-color: var(--laiton); }
.parcours button[aria-selected="true"] b { background: var(--laiton); color: #ffffff; border-color: var(--laiton); }

.scene { max-width: 1500px; margin: 0 auto; padding-block: 1.25rem 4rem; }

/* ---------- Composer ---------- */
.vue-composer { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 1.25rem; align-items: start; }
.arsenal { background: var(--pupitre); border: 1px solid var(--trait); border-radius: 8px; position: sticky; top: 10.5rem; max-height: calc(100vh - 12rem); display: flex; flex-direction: column; }
.arsenal-tete { padding: 1rem; display: grid; gap: .6rem; border-bottom: 1px solid var(--trait); }
.filtres { display: flex; flex-wrap: wrap; gap: .35rem; }
.filtre { cursor: pointer; background: none; border: 1px solid var(--trait); border-radius: 99px; padding: .2rem .65rem; font-size: .8rem; color: var(--sourdine); }
.filtre[aria-pressed="true"] { border-color: var(--laiton); color: var(--texte); background: var(--accent-doux); }
.cartes-pions { overflow-y: auto; padding: .75rem; display: grid; gap: .5rem; }
.carte-pion {
  display: grid; grid-template-columns: auto 1fr auto; gap: .65rem; align-items: center; background: var(--panneau);
  border: 1px solid var(--trait); border-radius: 6px; padding: .55rem .6rem; text-align: left; cursor: pointer; width: 100%;
}
.carte-pion:hover { border-color: var(--laiton); }
.forme { display: grid; gap: 2px; }
.forme i { display: block; width: 8px; height: 8px; border-radius: 1px; background: var(--c); }
.carte-pion-nom { font-weight: 600; font-size: .88rem; line-height: 1.25; }
.carte-pion-info { font-size: .74rem; color: var(--sourdine); display: flex; flex-wrap: wrap; gap: .2rem .6rem; margin-top: .15rem; }
.pips { display: inline-flex; gap: 2px; vertical-align: middle; }
.pips i { width: .55rem; height: .55rem; border-radius: 50%; background: var(--inter); display: block; }
.plus { font-size: 1.3rem; color: var(--laiton); font-weight: 600; width: 1.8rem; text-align: center; }
.vide-arsenal { color: var(--sourdine); font-size: .85rem; padding: 1rem; text-align: center; }

.dossier-tete { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; align-items: flex-end; margin-bottom: 1rem; }
.dossier-tete > div:first-child { min-width: 0; flex: 1 1 300px; }
.dossier-total { display: flex; gap: 1.25rem; }
.dossier-total div { display: grid; text-align: right; }
.dossier-total b { font-family: var(--f-titre); font-size: 1.5rem; font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }
.dossier-total small { color: var(--sourdine); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; }
#fiches { display: grid; gap: .75rem; }
.fiche { background: var(--panneau); border: 1px solid var(--trait); border-left: 4px solid var(--c, var(--inter)); border-radius: 6px; padding: .9rem 1rem; display: grid; gap: .7rem; }
.fiche-tete { display: flex; flex-wrap: wrap; gap: .4rem 1rem; align-items: flex-start; }
.fiche-titre { flex: 1 1 260px; min-width: 0; display: grid; gap: .15rem; }
.fiche-type { color: var(--sourdine); font-size: .7rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 600; }
.fiche-nom { font-family: var(--f-titre); font-size: 1.3rem; font-weight: 600; line-height: 1.15; }
.fiche-nom input { width: 100%; font-family: var(--f-titre); font-size: 1.15rem; }
.fiche-sous { color: var(--sourdine); font-size: .8rem; }
.fiche-cout { text-align: right; display: grid; }
.fiche-cout b { font-family: var(--f-chiffre); font-size: 1.15rem; font-weight: 500; }
.fiche-cout small { color: var(--sourdine); font-size: .74rem; }
.suppr { cursor: pointer; background: none; border: 1px solid transparent; color: var(--sourdine); border-radius: 4px; padding: .2rem .5rem; font-size: .8rem; }
.suppr:hover { color: var(--alerte); border-color: var(--alerte); }
.fiche-reglages { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; font-size: .85rem; }
.fiche-reglages label { color: var(--sourdine); display: flex; align-items: center; gap: .4rem; }
.fiche-reglages select, .fiche-reglages input { padding: .3rem .45rem; font-size: .85rem; }
.fiche-reglages input.prix { width: 6.5rem; font-family: var(--f-chiffre); text-align: right; }
.fiche-reglages input.dor { width: 3rem; text-align: right; }
.segment { display: inline-flex; border: 1px solid var(--trait); border-radius: 4px; overflow: hidden; }
.segment button { cursor: pointer; background: none; border: 0; padding: .3rem .7rem; font-size: .82rem; color: var(--sourdine); }
.segment button[aria-pressed="true"] { background: var(--laiton); color: #ffffff; font-weight: 600; }
.calendrier { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .4rem; }
.an-case { border: 1px solid var(--trait); border-radius: 5px; padding: .35rem .3rem; display: grid; justify-items: center; gap: .15rem; background: var(--pupitre); }
.an-case.actif { border-color: var(--laiton); background: var(--accent-doux); }
.an-case small { font-family: var(--f-titre); font-size: .85rem; color: var(--sourdine); }
.an-case.actif small { color: var(--laiton); }
.pas { display: flex; align-items: center; gap: .15rem; }
.pas button { cursor: pointer; width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 1px solid var(--trait); background: none; line-height: 1; padding: 0; }
.pas button:hover { border-color: var(--laiton); }
.pas output { font-family: var(--f-chiffre); min-width: 1.3rem; text-align: center; }
.coche { cursor: pointer; width: 100%; background: none; border: 0; padding: .15rem 0; font-size: .78rem; color: var(--sourdine); }
.an-case.actif .coche { color: var(--texte); font-weight: 600; }
.fiche textarea { width: 100%; min-height: 2.3rem; resize: vertical; font-size: .85rem; }
.badge { display: inline-block; font-size: .7rem; font-weight: 600; border-radius: 99px; padding: .05rem .55rem; border: 1px solid currentColor; }
.badge-attente { color: var(--attente); }
.badge-ok { color: var(--ok); }
.badge-alerte { color: var(--alerte); }
.alerte-texte { color: var(--alerte); font-size: .8rem; }
details summary { cursor: pointer; color: var(--sourdine); font-size: .8rem; }
details p { font-size: .82rem; color: var(--sourdine); margin-top: .3rem; max-width: 70ch; }
.dossier-vide { border: 1px dashed var(--trait); border-radius: 8px; padding: 2.5rem 1.5rem; text-align: center; color: var(--sourdine); display: grid; gap: .5rem; justify-items: center; }
.dossier-vide b { font-family: var(--f-titre); font-size: 1.3rem; color: var(--texte); }

/* ---------- Table ---------- */
.table-tete { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
.annees { display: flex; gap: .35rem; flex-wrap: wrap; }
.annees button, .bascule button { cursor: pointer; background: var(--pupitre); border: 1px solid var(--trait); border-radius: 4px; padding: .35rem .8rem; font-family: var(--f-titre); font-size: 1.05rem; color: var(--sourdine); }
.annees button[aria-pressed="true"], .bascule button[aria-pressed="true"] { border-color: var(--laiton); color: var(--texte); background: var(--accent-doux); }
.bascule { display: flex; gap: .35rem; }
.bascule button { font-family: var(--f-texte); font-size: .85rem; }
.table-cadre {
  background: radial-gradient(ellipse at 50% 0%, transparent, transparent 65%), var(--pupitre);
  border: 1px solid var(--trait); border-radius: 10px; padding: 1rem; box-shadow: 0 1px 2px rgba(22, 27, 46, .06);
}
.table-releve { display: flex; flex-wrap: wrap; gap: .5rem 2rem; margin-bottom: .8rem; }
.releve { display: grid; }
.releve small { color: var(--sourdine); font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; }
.releve b { font-family: var(--f-titre); font-weight: 600; font-size: 1.4rem; font-variant-numeric: lining-nums tabular-nums; }
.defile { overflow-x: auto; }
.plateau { --case: 1.85rem; display: grid; grid-template-columns: repeat(30, var(--case)); gap: 2px; width: max-content; margin: 0 auto; }
.fond { background: var(--case-vide); border-radius: 2px; }
.fond-hors { background: var(--hors); }
.fond-horstable { background: repeating-linear-gradient(135deg, var(--hors) 0 4px, var(--case-vide) 4px 8px); }
.pion {
  position: relative; z-index: 1; border-radius: 3px; overflow: hidden; display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: .68rem; line-height: 1.1; font-weight: 600; text-align: center; padding: 2px;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12);
}
.pion span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; text-shadow: 0 1px 1px rgba(0, 0, 0, .35); }
.pion-petit { font-size: .55rem; }
.pion-50::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, transparent 0 5px, rgba(179, 38, 30, .45) 5px 8px); pointer-events: none; }
.pion-case { font-size: .55rem; }
.pion-dorese { border-radius: 50%; box-shadow: inset 0 0 0 2px var(--pupitre); }
.pion-mesure { background-image: radial-gradient(rgba(255, 255, 255, .5) 1px, transparent 1.5px) !important; background-size: 5px 5px; }
.pion-debord { outline: 2px solid var(--alerte); outline-offset: -2px; }
.pion-mien { box-shadow: 0 0 0 2px var(--texte), 0 2px 6px rgba(0, 0, 0, .3); z-index: 2; }
.legende { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; margin-top: 1rem; font-size: .8rem; color: var(--sourdine); align-items: center; }
.puce-legende { display: inline-block; vertical-align: middle; margin-right: .35rem; width: 1rem; height: 1rem; border-radius: 3px; position: relative; overflow: hidden; }

/* ---------- Arbitrage ---------- */
.arb-tete { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; align-items: flex-end; margin-bottom: 1rem; }
.actions { display: flex; gap: .5rem; flex-wrap: wrap; }
.arb-annees { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .5rem; }
.arb-an { background: var(--panneau); border: 1px solid var(--trait); border-radius: 6px; padding: .7rem .8rem; display: grid; gap: .1rem; }
.arb-an .an { font-family: var(--f-titre); font-size: 1.15rem; font-weight: 600; }
.arb-an .l { display: flex; justify-content: space-between; font-size: .8rem; color: var(--sourdine); }
.arb-an .l b { font-family: var(--f-chiffre); font-weight: 500; color: var(--texte); }
.arb-colonnes { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 1.25rem; }
.decision { background: var(--panneau); border: 1px solid var(--trait); border-left: 4px solid var(--c, var(--inter)); border-radius: 6px; padding: .7rem .85rem; display: grid; gap: .5rem; margin-bottom: .5rem; }
.decision-tete { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; }
.decision-nom { font-weight: 600; }
.decision-nom small { display: block; color: var(--sourdine); font-weight: 400; font-size: .78rem; }
.choix { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }

<section id="ecran-accueil" class="seuil">

    <h1 class="logo">STRATEGIKON</h1>

      <button class="btn-lien" id="btn-montrer-creer" type="button">Ouvrir une nouvelle partie</button>

    <form id="form-creer" class="seuil-form" autocomplete="off" hidden>
      <label for="cre-nom">Nom de la nouvelle partie</label>

      <input id="cre-mdp" type="password" minlength="4" required>
      <label for="cre-mdp2">Confirmation</label>
      <input id="cre-mdp2" type="password" minlength="4" required>

      <p class="erreur" id="cre-erreur" role="alert"></p>
      <button class="btn-lien" id="btn-montrer-rejoindre" type="button">Revenir à la liste des parties</button>

    <div id="etape-role" hidden>
      <p class="seuil-q">Votre rôle dans <b id="nom-partie-role"></b></p>
      <div class="liste-roles" id="grille-roles"></div>

      <span class="poste-partie" id="poste-partie"></span>

      <div class="zone-table-tete">
        <div class="table-releve" id="table-releve"></div>
        <div class="bascules">

          <div class="bascule" role="group" aria-label="Vue">
            <button type="button" data-vue="demandes" aria-pressed="true">Demandes</button>
            <button type="button" data-vue="arbitrage" aria-pressed="false">Après arbitrage</button>
          </div>
        </div>

      <p class="consigne" id="consigne"></p>
      <div class="defile"><div class="plateau" id="plateau"></div></div>

  </main>
</section>

<script>
// Moteur de calcul STRATEGIKON : aucune dépendance à la page, testable avec Node.
// Unités : les montants sont en M€ ; 1 case = 100 M€ ; 1 pion DORESE = 1 case.
(function (racine) {
  "use strict";

  var CASE = 100; // M€
  var ANNEES = [2027, 2028, 2029, 2030, 2031, 2032];
  var ARMEES = ["Terre", "Marine", "Air et Espace", "Interarmées"];

  // Rôles des joueurs. « armee » = armée imputée par défaut aux lignes saisies.
  var ROLES = [
    { code: "EMAT", nom: "État-major de l'armée de Terre", armee: "Terre" },
    { code: "EMM", nom: "État-major de la Marine", armee: "Marine" },
    { code: "EMAAE", nom: "État-major de l'armée de l'Air et de l'Espace", armee: "Air et Espace" },
    { code: "COCA", nom: "EMA / COCA", armee: "Interarmées" },
    { code: "SC-Plans", nom: "Sous-chef d'état-major Plans", armee: "Interarmées" },
    { code: "CEMA", nom: "Cabinet du CEMA", armee: "Interarmées" },
    { code: "DGRIS", nom: "Direction générale des relations internationales et de la stratégie", armee: "Interarmées" },
    { code: "DGA", nom: "Direction générale de l'armement", armee: "Interarmées" },
    { code: "SGA", nom: "Secrétariat général pour l'administration", armee: "Interarmées" },
    { code: "MINARM", nom: "Cabinet du ministre des Armées", armee: "Interarmées" },
    { code: "MEFR", nom: "Ministère de l'Économie et des Finances", armee: "Interarmées" },
    { code: "MEAE", nom: "Ministère de l'Europe et des Affaires étrangères", armee: "Interarmées" },
    { code: "Animateur", nom: "Animateur de la partie", armee: "Interarmées" }
  ];

  // Types de ligne qu'un acteur peut saisir.
  var TYPES_LIGNE = {
    dorese: "Passer à 100 % (ajout des DORESE)",
    ajout: "Ajouter un pion",
    retrait: "Retirer un pion du socle",
    degrade: "Repasser une capacité à 50 % (retirer ses DORESE)",
    libre: "Option du catalogue ou pion sur mesure"
  };

  function parametresParDefaut() {
    return {
      table: 600, // cases par année (60 Md€)
      plafonds: { 2027: 590, 2028: 580, 2029: 570, 2030: 590, 2031: 590, 2032: 590 }, // cases
      // id de pion orange -> années où il est posé. Photo 2027 : SMV et munitions posés, répétés jusqu'en 2032.
      aleas: { P12: ANNEES.slice(), P13: ANNEES.slice() }
    };
  }

  function indexPions(pions) {
    var idx = {};
    pions.forEach(function (p) { idx[p.id] = p; });
    return idx;
  }

  function nbDorese(pion) {
    return pion ? pion.dorese.ao + pion.dorese.mco + pion.dorese.rh : 0;
  }

  // Situation de départ (photo 2027) : DORESE déjà posées sur chaque capacité du socle.
  function doreseDepart(pion) {
    var d = (pion && pion.depart) || {};
    return { ao: d.ao || 0, mco: d.mco || 0, rh: d.rh || 0 };
  }
  function nbDepart(pion) { var d = doreseDepart(pion); return d.ao + d.mco + d.rh; }
  // DORESE qui manquent à une capacité du socle pour être à 100 %.
  function doreseManquantes(pion) {
    if (!pion) return { ao: 0, mco: 0, rh: 0 };
    var d = doreseDepart(pion);
    return { ao: Math.max(0, pion.dorese.ao - d.ao), mco: Math.max(0, pion.dorese.mco - d.mco), rh: Math.max(0, pion.dorese.rh - d.rh) };
  }
  function nbManquantes(pion) { var m = doreseManquantes(pion); return m.ao + m.mco + m.rh; }
  // Coût annuel d'un pion du socle tel qu'il est posé au départ.
  function coutSocle(pion) { return pion.cout50 + nbDepart(pion) * CASE; }
  function typesDorese(d) {
    var t = [];
    ["ao", "mco", "rh"].forEach(function (k) { for (var n = 0; n < (d[k] || 0); n++) t.push(k); });
    return t;
  }

  // Le socle : ce qui est posé d'office chaque année (gris, violets, capacités à 50 %,
  // et les pions orange que l'animateur a activés pour l'année).
  function estDansSocle(pion, annee, params) {
    if (pion.type === "orange") {
      var annees = (params.aleas || {})[pion.id] || [];
      return annees.indexOf(annee) !== -1 || annees.indexOf(String(annee)) !== -1;
    }
    return true;
  }

  // Coût unitaire d'une ligne (M€) et DORESE unitaires.
  function unitaire(ligne, idx) {
    var pion = idx[ligne.pion];
    var vide = { cout: 0, dorese: { ao: 0, mco: 0, rh: 0 } };
    switch (ligne.type) {
      case "dorese":
        if (!pion) return vide;
        return { cout: nbManquantes(pion) * CASE, dorese: doreseManquantes(pion) };
      case "ajout":
        if (!pion) return vide;
        if (Number(ligne.niveau) === 100) return { cout: pion.cout100, dorese: copie(pion.dorese) };
        return { cout: pion.cout50, dorese: { ao: 0, mco: 0, rh: 0 } };
      case "degrade":
        if (!pion) return vide;
        var dd = doreseDepart(pion);
        return { cout: -nbDepart(pion) * CASE, dorese: { ao: -dd.ao, mco: -dd.mco, rh: -dd.rh } };
      case "retrait":
        if (!pion) return vide;
        return { cout: -coutSocle(pion), dorese: { ao: 0, mco: 0, rh: 0 } };
      case "libre":
        return {
          cout: Number(ligne.cout_unitaire) || 0,
          dorese: {
            ao: Number((ligne.dorese || {}).ao) || 0,
            mco: Number((ligne.dorese || {}).mco) || 0,
            rh: Number((ligne.dorese || {}).rh) || 0
          }
        };
      default:
        return vide;
    }
  }

  function copie(d) { return { ao: d.ao, mco: d.mco, rh: d.rh }; }

  function quantite(ligne, annee) {
    var q = Number((ligne.qte || {})[annee]) || 0;
    // Un pion du socle n'existe qu'en un exemplaire : on plafonne à 1.
    if (ligne.type === "dorese" || ligne.type === "retrait" || ligne.type === "degrade") q = Math.max(0, Math.min(1, q));
    return Math.max(0, q);
  }

  // Coût d'une ligne par année : { 2027: {cout, dorese:{ao,mco,rh}}, ..., total }
  function coutLigne(ligne, idx) {
    var u = unitaire(ligne, idx);
    var res = { total: 0, totalDorese: 0, annees: {} };
    ANNEES.forEach(function (a) {
      var q = quantite(ligne, a);
      var d = { ao: u.dorese.ao * q, mco: u.dorese.mco * q, rh: u.dorese.rh * q };
      res.annees[a] = { cout: u.cout * q, dorese: d };
      res.total += u.cout * q;
      res.totalDorese += d.ao + d.mco + d.rh;
    });
    return res;
  }

  function armeeDeLigne(ligne, idx) {
    if (ligne.armee) return ligne.armee;
    var pion = idx[ligne.pion];
    return pion ? pion.armee : "Interarmées";
  }

  function zeroArmees() {
    var o = {};
    ARMEES.forEach(function (a) { o[a] = 0; });
    return o;
  }

  // Synthèse d'une partie, année par année.
  // filtre(ligne) -> bool permet de ne compter qu'une partie des lignes (ex. un rôle).
  function synthese(pions, lignes, params, filtre) {
    var idx = indexPions(pions);
    params = params || parametresParDefaut();
    var res = {};
    ANNEES.forEach(function (a) {
      var socle = zeroArmees();
      var demandes = zeroArmees();
      pions.forEach(function (p) {
        if (estDansSocle(p, a, params)) socle[p.armee] = (socle[p.armee] || 0) + coutSocle(p);
      });
      var dorese = { ao: 0, mco: 0, rh: 0 };
      lignes.forEach(function (l) {
        if (filtre && !filtre(l)) return;
        var c = coutLigne(l, idx).annees[a];
        var arm = armeeDeLigne(l, idx);
        demandes[arm] = (demandes[arm] || 0) + c.cout;
        dorese.ao += c.dorese.ao; dorese.mco += c.dorese.mco; dorese.rh += c.dorese.rh;
      });
      var totalSocle = somme(socle);
      var totalDemandes = somme(demandes);
      var plafond = (Number((params.plafonds || {})[a]) || 0) * CASE;
      var total = totalSocle + totalDemandes;
      res[a] = {
        annee: a,
        socle: socle,
        demandes: demandes,
        totalSocle: totalSocle,
        totalDemandes: totalDemandes,
        total: total,
        plafond: plafond,
        table: (Number(params.table) || 600) * CASE,
        marge: plafond - total,
        dorese: dorese
      };
    });
    return res;
  }

  function somme(o) {
    return Object.keys(o).reduce(function (s, k) { return s + o[k]; }, 0);
  }

  // Remplissage de la grille d'une année : renvoie une liste de blocs
  // { armee, nature: 'gris'|'violet'|'orange'|'capacite'|'dorese'|'libre'|'retrait', libelle, cases }
  // dans l'ordre de pose. Les DORESE suivent immédiatement leur capacité (règle « Au contact »).
  function blocsAnnee(pions, lignes, params, annee) {
    var idx = indexPions(pions);
    var blocs = [];
    var retires = {};
    var passes100 = {}, degrades = {};
    lignes.forEach(function (l) {
      var q = quantite(l, annee);
      if (!q) return;
      if (l.type === "retrait") retires[l.pion] = true;
      if (l.type === "dorese") passes100[l.pion] = l;
      if (l.type === "degrade") degrades[l.pion] = l;
    });
    var ordreType = { gris: 0, violet: 1, orange: 2, capacite: 3 };
    var socle = pions.filter(function (p) { return estDansSocle(p, annee, params) && !retires[p.id]; });
    // Fixes d'abord, puis armée par armée.
    socle.sort(function (a, b) {
      var fa = a.type === "gris" ? 0 : 1, fb = b.type === "gris" ? 0 : 1;
      if (fa !== fb) return fa - fb;
      var aa = ARMEES.indexOf(a.armee), ab = ARMEES.indexOf(b.armee);
      if (aa !== ab) return aa - ab;
      return ordreType[a.type] - ordreType[b.type];
    });
    socle.forEach(function (p) {
      var dg = !!degrades[p.id] && !passes100[p.id];
      var plein = p.type === "capacite" && nbManquantes(p) === 0 && !dg;
      blocs.push({ armee: p.armee, nature: p.type, libelle: p.nom, cases: p.cout50 / CASE, niveau: plein || passes100[p.id] ? 100 : 50 });
      if (nbDepart(p) && !dg) blocs.push({ armee: p.armee, nature: "dorese", libelle: "DORESE " + p.nom, cases: nbDepart(p) });
      if (passes100[p.id] && nbManquantes(p)) {
        blocs[blocs.length - 1 - (nbDepart(p) ? 1 : 0)].niveau = 100;
        blocs.push({ armee: armeeDeLigne(passes100[p.id], idx), nature: "dorese", libelle: "DORESE " + p.nom, cases: nbManquantes(p) });
      }
    });
    lignes.forEach(function (l) {
      var q = quantite(l, annee);
      if (!q || l.type === "dorese" || l.type === "retrait" || l.type === "degrade") return;
      var arm = armeeDeLigne(l, idx);
      if (l.type === "ajout") {
        var p = idx[l.pion];
        if (!p) return;
        for (var i = 0; i < q; i++) {
          blocs.push({ armee: arm, nature: "capacite", libelle: "+ " + p.nom, cases: p.cout50 / CASE, niveau: Number(l.niveau), role: l.role });
          if (Number(l.niveau) === 100 && nbDorese(p)) {
            blocs.push({ armee: arm, nature: "dorese", libelle: "DORESE + " + p.nom, cases: nbDorese(p), role: l.role });
          }
        }
      } else if (l.type === "libre") {
        var c = (Number(l.cout_unitaire) || 0) * q / CASE;
        if (c > 0) blocs.push({ armee: arm, nature: "libre", libelle: l.libelle || "Ligne libre", cases: Math.round(c), role: l.role });
      }
    });
    return blocs;
  }


  // ---------- Placement sur la table (grille de 30 colonnes) ----------
  // Pose les pions avec leur forme réelle, groupe par groupe (dépenses fixes, puis chaque armée).
  // Pions rigides : socle et pions ajoutés (largeur x hauteur, rotation permise).
  // Les DORESE d'une capacité à 100 % sont posées au contact de la capacité.
  // Les montants libres (investissements, options, pions sur mesure) sont sécables :
  // ils comblent les cases restantes de leur groupe.
  var LARGEUR = 30;
  // « Attente » : les pions ajoutés qui n'ont pas encore été arbitrés, posés côte à côte après le socle.
  var ORDRE_GROUPES = ["Fixes", "Interarmées", "Terre", "Marine", "Air et Espace", "Attente"];

  function Plateau(lignesInit) {
    this.l = LARGEUR;
    this.h = lignesInit;
    this.occ = [];
    for (var i = 0; i < this.l * this.h; i++) this.occ.push(null);
  }
  Plateau.prototype.agrandir = function (n) {
    for (var i = 0; i < n * this.l; i++) this.occ.push(null);
    this.h += n;
  };
  Plateau.prototype.libre = function (r, c) {
    return r >= 0 && c >= 0 && c < this.l && r < this.h && this.occ[r * this.l + c] === null;
  };
  Plateau.prototype.tient = function (r, c, w, h) {
    if (c + w > this.l || r + h > this.h) return false;
    for (var i = r; i < r + h; i++) for (var j = c; j < c + w; j++) if (!this.libre(i, j)) return false;
    return true;
  };
  Plateau.prototype.marquer = function (r, c, w, h, id) {
    for (var i = r; i < r + h; i++) for (var j = c; j < c + w; j++) this.occ[i * this.l + j] = id;
  };
  // Première position libre (haut-gauche d'abord) à partir de la rangée r0.
  Plateau.prototype.chercher = function (w, h, r0) {
    for (;;) {
      for (var r = r0; r < this.h; r++) {
        for (var c = 0; c < this.l; c++) {
          if (this.tient(r, c, w, h)) return { r: r, c: c, w: w, h: h };
          if (w !== h && this.tient(r, c, h, w)) return { r: r, c: c, w: h, h: w };
        }
      }
      this.agrandir(Math.max(h, w > this.l ? 1 : 1));
      if (w > this.l && h > this.l) return null;
    }
  };
  Plateau.prototype.apresDerniereLigne = function () {
    for (var k = this.occ.length - 1; k >= 0; k--) if (this.occ[k] !== null) return Math.floor(k / this.l) + 1;
    return 0;
  };
  Plateau.prototype.premiereLigneLibre = function () {
    for (var k = 0; k < this.occ.length; k++) if (this.occ[k] === null) return Math.floor(k / this.l);
    return this.h;
  };

  // filtreSocle(pion) -> bool (facultatif) : ne pose que ces pions du socle (vue « ma demande »).
  // options.apresArbitrage : les lignes sont déjà arbitrées (différés décalés), seules les « en attente » restent à part.
  function placerAnnee(pions, lignes, params, annee, filtreSocle, options) {
    options = options || {};
    function statutDe(l) {
      var st = arbitrageDe(l, params).statut;
      if (st === "retenu") return null;
      if (options.apresArbitrage && st !== "attente") return null;
      return st;
    }
    var idx = indexPions(pions);
    params = params || parametresParDefaut();
    var tableCases = Number(params.table) || 600;
    var plateau = new Plateau(Math.ceil(tableCases / LARGEUR));
    var pieces = [];
    var retires = {}, passes100 = {}, degrades = {};
    lignes.forEach(function (l) {
      if (!quantite(l, annee)) return;
      if (l.type === "retrait") retires[l.pion] = true;
      if (l.type === "dorese") passes100[l.pion] = l;
      if (l.type === "degrade") degrades[l.pion] = l;
    });

    // Constitution des groupes.
    var groupes = {};
    ORDRE_GROUPES.forEach(function (g) { groupes[g] = { rigides: [], secables: [] }; });
    function groupe(nom) { return groupes[nom] || groupes["Interarmées"]; }
    pions.forEach(function (p) {
      if (!estDansSocle(p, annee, params) || retires[p.id]) return;
      if (filtreSocle && !filtreSocle(p)) return;
      var l100 = passes100[p.id] && nbManquantes(p) ? passes100[p.id] : null;
      var g = p.type === "gris" ? "Fixes" : (l100 ? armeeDeLigne(l100, idx) : p.armee);
      var dg = degrades[p.id] && !passes100[p.id] ? degrades[p.id] : null;
      var types = (dg ? [] : typesDorese(doreseDepart(p))).concat(l100 ? typesDorese(doreseManquantes(p)) : []);
      var plein = types.length >= nbDorese(p);
      groupe(g).rigides.push({ pion: p, w: p.l || 1, h: p.h || 1, armee: g === "Fixes" ? p.armee : g, nature: p.type,
        libelle: p.nom, niveau: plein ? 100 : 50, dorese: types.length, types: types, socle: true,
        nDepart: dg ? 0 : nbDepart(p), ligneDorese: l100 ? l100.id : null, roleDorese: l100 ? l100.role : null, degrade: dg ? dg.id : null,
        statutDorese: l100 ? statutDe(l100) : null });
    });
    lignes.forEach(function (l) {
      var q = quantite(l, annee);
      if (!q || l.type === "dorese" || l.type === "retrait" || l.type === "degrade") return;
      var arm = armeeDeLigne(l, idx);
      var st = statutDe(l);
      var dest = st ? "Attente" : arm;
      if (l.type === "ajout") {
        var p = idx[l.pion];
        if (!p) return;
        for (var i = 0; i < q; i++) {
          var cent = Number(l.niveau) === 100;
          groupe(dest).rigides.push({ pion: p, w: p.l || 1, h: p.h || 1, armee: arm, nature: p.type, libelle: "+ " + p.nom,
            niveau: cent ? 100 : 50, dorese: cent ? nbDorese(p) : 0, detailDorese: p.dorese, role: l.role, ligne: l.id, statut: st });
        }
      } else if (l.type === "libre") {
        var n = Math.round((Number(l.cout_unitaire) || 0) * q / CASE);
        if (n > 0) groupe(dest).secables.push({ cases: n, armee: arm, nature: "libre", libelle: l.libelle || "Ligne libre", role: l.role, ligne: l.id, horsCatalogue: !l.modele, statut: st });
      }
    });

    var cellules = []; // cases isolées : DORESE et montants sécables
    ORDRE_GROUPES.forEach(function (nomG) {
      var g = groupes[nomG];

      // La zone « Attente » commence sous tout le reste, pour rester à part.
      var r0 = nomG === "Attente" ? plateau.apresDerniereLigne() + 1 : plateau.premiereLigneLibre(); // une ligne vide pour le titre de la zone
      var rMin = nomG === "Attente" ? r0 : 0;
      g.rigides.sort(function (a, b) { return (b.w * b.h + b.dorese) - (a.w * a.h + a.dorese) || b.w - a.w; });
      g.rigides.forEach(function (it) {
        var id = pieces.length;
        var pos;
        // Avec DORESE : on cherche d'abord une place pour la capacité et ses DORESE en bande à droite.
        if (it.dorese) {
          var col = Math.ceil(it.dorese / it.h);
          pos = null;
          for (var r = r0; r < plateau.h && !pos; r++) {
            for (var c = 0; c < plateau.l; c++) {
              if (plateau.tient(r, c, it.w + col, it.h)) { pos = { r: r, c: c, w: it.w, h: it.h }; break; }
            }
          }
          if (!pos) pos = plateau.chercher(it.w, it.h, r0);
        } else {
          pos = plateau.chercher(it.w, it.h, r0);
        }
        plateau.marquer(pos.r, pos.c, pos.w, pos.h, id);
        pieces.push({ r: pos.r, c: pos.c, w: pos.w, h: pos.h, armee: it.armee, nature: it.nature, libelle: it.libelle,
          pion: it.pion ? it.pion.id : null, ligne: it.ligne || null, socle: !!it.socle, ligneDorese: it.ligneDorese || null, degrade: it.degrade || null,
          niveau: it.nature === "capacite" ? it.niveau : null, role: it.role || null, groupe: nomG, cases: pos.w * pos.h, statut: it.statut || null });
        // DORESE au contact : cases libres voisines de la capacité (ou de ses DORESE déjà posées).
        var types = it.types || typesDorese(it.detailDorese || {});
        var amas = [{ r: pos.r, c: pos.c, w: pos.w, h: pos.h }];
        types.slice(0, it.dorese).forEach(function (t, n) {
          var ajoutee = it.socle && n >= (it.nDepart || 0);
          var cand = voisinLibre(plateau, amas, rMin);
          if (!cand) { var p2 = plateau.chercher(1, 1, r0); cand = { r: p2.r, c: p2.c, loin: true }; }
          plateau.marquer(cand.r, cand.c, 1, 1, "d" + id);
          amas.push({ r: cand.r, c: cand.c, w: 1, h: 1 });
          cellules.push({ r: cand.r, c: cand.c, armee: it.armee, nature: "dorese", type: t, libelle: "DORESE " + t.toUpperCase() + " · " + it.libelle,
            role: ajoutee ? it.roleDorese : (it.role || null), loin: !!cand.loin, parent: id, ligne: ajoutee ? it.ligneDorese : (it.ligne || null),
            groupe: nomG, statut: ajoutee ? (it.statutDorese || null) : (it.statut || null) });
        });
      });
      // Montants sécables : premier trou libre du groupe, puis cases voisines pour garder le bloc d'un seul tenant.
      g.secables.forEach(function (it) {
        var amas = [];
        for (var n = 0; n < it.cases; n++) {
          var cand = amas.length ? voisinLibre(plateau, amas, rMin) : null;
          if (!cand) {
            var k = r0 * plateau.l;
            while (true) {
              if (k >= plateau.occ.length) plateau.agrandir(1);
              if (plateau.occ[k] === null) break;
              k++;
            }
            cand = { r: Math.floor(k / plateau.l), c: k % plateau.l };
          }
          plateau.marquer(cand.r, cand.c, 1, 1, "s");
          amas.push({ r: cand.r, c: cand.c, w: 1, h: 1 });
          cellules.push({ r: cand.r, c: cand.c, armee: it.armee, nature: "libre", libelle: it.libelle, role: it.role, horsCatalogue: it.horsCatalogue, ligne: it.ligne, groupe: nomG, statut: it.statut || null });
        }
      });
    });

    return {
      largeur: LARGEUR,
      hauteur: Math.max(plateau.h, Math.ceil(tableCases / LARGEUR)),
      table: tableCases,
      plafond: Number((params.plafonds || {})[annee]) || 0,
      occupees: plateau.occ.filter(function (x) { return x !== null; }).length,
      pieces: pieces,
      cellules: cellules
    };
  }

  function voisinLibre(plateau, amas, rMin) {
    var meilleur = null;
    amas.forEach(function (b) {
      for (var r = b.r - 1; r <= b.r + b.h; r++) {
        for (var c = b.c - 1; c <= b.c + b.w; c++) {
          var bord = (r === b.r - 1 || r === b.r + b.h) !== (c === b.c - 1 || c === b.c + b.w); // côté, pas coin
          if (!bord || r < (rMin || 0) || !plateau.libre(r, c)) continue;
          if (!meilleur || r * plateau.l + c < meilleur.r * plateau.l + meilleur.c) meilleur = { r: r, c: c };
        }
      }

  }


  // ---------- Arbitrage CEMA ----------
  // params.arbitrages[idLigne] = { statut: 'attente'|'retenu'|'differe'|'renonce', decalage: n }
  var STATUTS = { attente: "En attente", retenu: "Retenu", differe: "Différé", renonce: "Renoncé" };

  function arbitrageDe(ligne, params) {
    var a = ((params || {}).arbitrages || {})[ligne.id];
    return a && STATUTS[a.statut] ? a : { statut: "attente", decalage: 0 };
  }

  // Ligne telle qu'elle pèse après arbitrage (null si renoncée). Un différé décale les années ;
  // ce qui sort de la période est reporté hors LPM.
  function ligneArbitree(ligne, params) {
    var a = arbitrageDe(ligne, params);
    if (a.statut === "renonce") return null;
    if (a.statut !== "differe" || !Number(a.decalage)) return ligne;
    var n = Number(a.decalage), qte = {};
    ANNEES.forEach(function (an) {
      var q = (ligne.qte || {})[an];
      if (q && ANNEES.indexOf(an + n) !== -1) qte[an + n] = (qte[an + n] || 0) + Number(q);
    });
    var copie = JSON.parse(JSON.stringify(ligne));
    copie.qte = qte;
    return copie;
  }

  function lignesApresArbitrage(lignes, params) {
    return lignes.map(function (l) { return ligneArbitree(l, params); }).filter(Boolean);
  }

  // Montant reporté au-delà de 2032 par un différé (M€).
  function reportHorsLpm(ligne, params, idx) {
    var a = arbitrageDe(ligne, params);
    if (a.statut !== "differe") return 0;
    var avant = coutLigne(ligne, idx).total;
    var apres = coutLigne(ligneArbitree(ligne, params), idx).total;
    return avant - apres;
  }

  // Arrondi d'un prix à la case de 100 M€ (au moins une case).
  function arrondiCase(m) {
    var n = Number(m) || 0;
    if (n <= 0) return 0;
    return Math.max(CASE, Math.round(n / CASE) * CASE);
  }

  var API = {
    CASE: CASE,
    ANNEES: ANNEES,
    ARMEES: ARMEES,
    ROLES: ROLES,
    TYPES_LIGNE: TYPES_LIGNE,
    parametresParDefaut: parametresParDefaut,
    indexPions: indexPions,
    nbDorese: nbDorese,
    doreseDepart: doreseDepart,
    nbDepart: nbDepart,
    doreseManquantes: doreseManquantes,
    nbManquantes: nbManquantes,
    coutSocle: coutSocle,
    unitaire: unitaire,
    quantite: quantite,
    coutLigne: coutLigne,
    armeeDeLigne: armeeDeLigne,
    synthese: synthese,
    blocsAnnee: blocsAnnee,
    placerAnnee: placerAnnee,
    STATUTS: STATUTS,
    arbitrageDe: arbitrageDe,
    ligneArbitree: ligneArbitree,
    lignesApresArbitrage: lignesApresArbitrage,
    reportHorsLpm: reportHorsLpm,
    arrondiCase: arrondiCase,
    LARGEUR: LARGEUR
  };

  if (typeof module !== "undefined" && module.exports) module.exports = API;
  else racine.STRAT_MOTEUR = API;
})(typeof window !== "undefined" ? window : this);

<script>
// Stockage des parties. Deux modes, même interface (toutes les méthodes renvoient une Promise) :
//  - « partagé » : base Supabase (clés dans js/config.js), ou feuille Google via Apps Script ;
//  - « local »   : navigateur seul (localStorage), pour essayer l'outil sans rien installer.
// Interface : listerParties, creerPartie, ouvrirPartie, lireEtat, majParams, ecrireLigne, supprimerLigne.
(function (racine) {
  "use strict";

  var CONFIG = racine.STRAT_CONFIG || {};

  // ---------- Mode partagé : Google Sheets via Apps Script ----------
  // Page servie par Apps Script : on passe par google.script.run.
  // Page hébergée ailleurs : on appelle l'URL du script (config.appsScriptUrl) en POST.
  function Partage(url) {
    this.mode = "partage";
    this.url = url || "";
  }
  Partage.prototype.appel = function (action, args) {
    var url = this.url;
    if (racine.google && racine.google.script && racine.google.script.run) {
      return new Promise(function (ok, ko) {
        racine.google.script.run
          .withSuccessHandler(function (r) { ok(JSON.parse(r)); })
          .withFailureHandler(function (e) { ko(new Error(String((e && e.message) || e).replace(/^Error:\s*/, ""))); })
          .appeler(action, args || {});
      });
    }
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: action, args: args || {} })
    }).then(function (r) { return r.json(); }).then(function (r) {
      if (!r.ok) throw new Error(r.erreur || "Erreur du serveur");
      return r.resultat;
    });
  };
  Partage.prototype.listerParties = function () { return this.appel("listerParties"); };
  Partage.prototype.creerPartie = function (nom, mdp, params) { return this.appel("creerPartie", { nom: nom, mdp: mdp, params: params }); };
  Partage.prototype.ouvrirPartie = function (nom, mdp) { return this.appel("ouvrirPartie", { nom: nom, mdp: mdp }); };
  Partage.prototype.lireEtat = function (nom, mdp) { return this.appel("lireEtat", { nom: nom, mdp: mdp }); };
  Partage.prototype.majParams = function (nom, mdp, params) { return this.appel("majParams", { nom: nom, mdp: mdp, params: params }); };
  Partage.prototype.ecrireLigne = function (nom, mdp, ligne) { return this.appel("ecrireLigne", { nom: nom, mdp: mdp, ligne: ligne }); };
  Partage.prototype.supprimerLigne = function (nom, mdp, id) { return this.appel("supprimerLigne", { nom: nom, mdp: mdp, id: id }); };

  // ---------- Mode partagé : Supabase (fonctions SQL de supabase/schema.sql) ----------
  function Supabase(url, cle) {
    this.mode = "partage";
    this.url = url.replace(/\/+$/, "");
    this.cle = cle;
  }
  Supabase.prototype.rpc = function (fonction, args) {

    if (this.cle.indexOf("sb_") !== 0) entetes.Authorization = "Bearer " + this.cle;
    return fetch(this.url + "/rest/v1/rpc/" + fonction, {
      method: "POST", headers: entetes, body: JSON.stringify(args || {})
    }).then(function (r) {
      return r.text().then(function (t) {
        var corps = null;
        try { corps = t ? JSON.parse(t) : null; } catch (e) { corps = { message: t }; }
        if (!r.ok) throw new Error((corps && corps.message) || "Erreur du serveur (" + r.status + ")");

  };

  Supabase.prototype.creerPartie = function (nom, mdp, params) { return this.rpc("creer_partie", { p_nom: nom, p_mdp: mdp, p_params: params }); };

  };

  };

    var etat = this.lire();

  };

    var sel = Math.random().toString(36).slice(2);
    return hacher(sel + mdp).then(function (h) {
      var p = { id: "local-" + Date.now(), nom: nom, sel: sel, mdp_hash: h, params: params, cree_le: new Date().toISOString(), lignes: {} };

  };
  Local.prototype.lireEtat = function (nom, mdp) {

  };

})(window);

// STRATEGIKON, conception « table d'abord » : le joueur agit sur la table de l'année,

  var ROLES_VUE_COMPLETE = ["CEMA", "Animateur", "SC-Plans"];

    partie: null, mdp: "", role: "", lignes: [], annee: M.ANNEES[0], vue: "demandes",

  function chargerParties() {

    vider(sel);
    return S.listerParties().then(function (liste) {
      if (!liste.length) sel.appendChild(el("option", { value: "", texte: "Aucune partie ouverte" }));
      liste.forEach(function (p) { sel.appendChild(el("option", { value: p.nom, texte: p.nom })); });
    }).catch(function (e) { sel.appendChild(el("option", { value: "", texte: "Liste indisponible" })); $("rej-erreur").textContent = e.message; });
  }
  function etapeAccueil(nom) {
    $("form-rejoindre").hidden = nom !== "rejoindre";
    $("form-creer").hidden = nom !== "creer";
    $("etape-role").hidden = nom !== "role";
  }
  function montrerRoles(partie, mdp) {
    etat.partie = partie; etat.mdp = mdp;
    $("ecran-partie").hidden = true; $("ecran-accueil").hidden = false;
    etapeAccueil("role");
    $("nom-partie-role").textContent = partie.nom;
    var g = $("grille-roles");
    vider(g);
    M.ROLES.forEach(function (r) {
      g.appendChild(el("button", { classe: "role-ligne", type: "button", style: "--c:" + couleur(r.armee), onclick: function () { entrer(r.code); } }, [
        el("b", { texte: r.code }), el("span", { texte: r.nom })
      ]));
    });
  }
  function entrer(code) {
    etat.role = code;
    etat.selection = null;
    etat.maTable = !vueComplete();
    etat.volet = "poser";
    etat.filtre = role(code).armee === "Interarmées" && CATALOGUE.some(function (o) { return o.role === code; }) ? "options" : "capacites";
    $("ecran-accueil").hidden = true;
    $("ecran-partie").hidden = false;
    $("poste-partie").textContent = etat.partie.nom;
    $("insigne-code").textContent = code;
    $("insigne-nom").textContent = role(code).nom;
    memoriser();
    signature = "";
    return recharger(true);
  }
  function quitter() {
    etat.partie = null; etat.mdp = ""; etat.role = ""; etat.lignes = []; signature = "";
    memoriser();
    $("ecran-partie").hidden = true; $("ecran-accueil").hidden = false;
    etapeAccueil("rejoindre");
    chargerParties();
  }

  // ---------- Données ----------
  function recharger(forcer) {
    if (!etat.partie) return Promise.resolve();
    var nom = etat.partie.nom;
    return S.lireEtat(nom, etat.mdp).then(function (e) {
      if (!etat.partie || etat.partie.nom !== nom) return;
      var lignes = e.lignes.slice().sort(function (a, b) { return (a.cree_le || "") < (b.cree_le || "") ? -1 : 1; });
      lignes = lignes.map(function (l) { return enAttente[l.id] ? (ligneDe(l.id) || l) : l; });
      etat.lignes.forEach(function (l) { if (enAttente[l.id] && !lignes.some(function (x) { return x.id === l.id; })) lignes.push(l); });
      var sig = JSON.stringify(lignes) + JSON.stringify(e.partie.params);
      etat.partie.params = e.partie.params;
      etat.lignes = lignes;
      if (forcer || sig !== signature) { signature = sig; rendre(forcer); }
    }).catch(function (e) { toast(e.message); });
  }
  function enregistrer(l) {
    clearTimeout(enAttente[l.id]);
    enAttente[l.id] = setTimeout(function () {
      S.ecrireLigne(etat.partie.nom, etat.mdp, l).then(function () { delete enAttente[l.id]; })
        .catch(function (e) { delete enAttente[l.id]; toast("Non enregistré : " + e.message); });
    }, 350);
  }
  function supprimer(l) {
    clearTimeout(enAttente[l.id]); delete enAttente[l.id];
    etat.lignes = etat.lignes.filter(function (x) { return x.id !== l.id; });
    S.supprimerLigne(etat.partie.nom, etat.mdp, l.id).catch(function (e) { toast(e.message); });
  }
  var fileParams = Promise.resolve();
  function modifierParams(fn) {
    fileParams = fileParams.then(function () {
      return S.lireEtat(etat.partie.nom, etat.mdp).then(function (e) {
        var p = e.partie.params && e.partie.params.plafonds ? e.partie.params : M.parametresParDefaut();
        fn(p);
        return S.majParams(etat.partie.nom, etat.mdp, p).then(function () { etat.partie.params = p; rendre(false); });
      });
    }).catch(function (e) { toast("Non enregistré : " + e.message); });
    return fileParams;
  }

  // ---------- Gestes sur la table : ils écrivent les lignes ----------
  function memeGeste(l, g) {
    if (l.role !== etat.role || l.type !== g.type) return false;
    if (g.type === "ajout") return l.pion === g.pion && Number(l.niveau) === Number(g.niveau);
    if (g.type === "dorese" || g.type === "retrait" || g.type === "degrade") return l.pion === g.pion;
    if (g.type === "libre") return !!g.modele && l.modele === g.modele;
    return false;
  }
  // Pose un pion (ou un renforcement, une dissolution) sur les années de la portée.
  function poser(g) {
    var ans = anneesPortee();
    var l = etat.lignes.filter(function (x) { return memeGeste(x, g); })[0];
    if (!l) {
      var r = role(etat.role);
      l = { id: nouvelId(), role: etat.role, type: g.type, qte: {}, justification: "", cree_le: new Date().toISOString() };
      M.ANNEES.forEach(function (a) { l.qte[a] = 0; });
      if (g.type === "libre") {
        var o = optionDe(g.modele);
        l.modele = o ? o.code : null;
        l.libelle = g.libelle || (o ? o.libelle : "");
        l.armee = g.armee || (o ? o.armee : r.armee);
        l.source = o ? o.source : null;
        l.cout_unitaire = g.cout !== undefined ? M.arrondiCase(g.cout) : (o && o.cout ? M.arrondiCase(o.cout) : 0);
        l.dorese = o && o.dorese ? { ao: o.dorese.ao || 0, mco: o.dorese.mco || 0, rh: o.dorese.rh || 0 } : { ao: 0, mco: 0, rh: 0 };
      } else {
        var p = IDX[g.pion];
        l.pion = p.id;
        l.niveau = g.niveau || 100;
        l.armee = r.armee !== "Interarmées" ? r.armee : p.armee;
      }
      etat.lignes.push(l);
    }
    ans.forEach(function (a) {
      var q = Number(l.qte[a]) || 0;
      l.qte[a] = g.type === "ajout" || (g.type === "libre" && !g.modele) ? q + 1 : 1;
    });
    enregistrer(l);
    etat.selection = { ligne: l.id, pion: l.pion || null };
    etat.neuf = l.id;
    etat.volet = "selection";
    rendre(true);
    toast(natureLigne(l) + " · " + libelleLigne(l) + " · " + textePortee());
    return l;
  }
  // Retire le geste sur les années de la portée ; la ligne disparaît quand plus rien n'est posé.
  function enlever(l) {
    anneesPortee().forEach(function (a) {
      var q = Number(l.qte[a]) || 0;
      l.qte[a] = l.type === "ajout" || l.type === "libre" ? Math.max(0, q - 1) : 0;
    });
    if (!M.ANNEES.some(function (a) { return M.quantite(l, a) > 0; })) { supprimer(l); etat.selection = null; etat.volet = "poser"; }
    else enregistrer(l);
    rendre(true);
  }

  // ---------- Rendu ----------
  function rendre(complet) {
    rendreJauges();
    rendreTable();
    var actif = document.activeElement;
    var saisie = actif && /^(INPUT|TEXTAREA|SELECT)$/.test(actif.tagName) && $("volet").contains(actif);
    if (complet || !saisie) rendreVolet();
  }

  function rendreJauges() {
    var j = $("jauges");
    vider(j);
    var p = params();
    var lignes = etat.vue === "arbitrage" ? M.lignesApresArbitrage(etat.lignes, p) : etat.lignes;
    var syn = M.synthese(PIONS, lignes, p);
    M.ANNEES.forEach(function (a) {
      var s = syn[a];
      var tableMax = Math.max(s.table, s.total);
      var barre = el("span", { classe: "mini-barre" }, [
        el("span", { style: "width:" + (100 * Math.min(s.total, tableMax) / tableMax) + "%", classe: s.marge < 0 ? "trop" : "" }),
        el("i", { style: "left:" + (100 * s.plafond / tableMax) + "%" })
      ]);
      j.appendChild(el("button", { classe: "an-jauge", type: "button", role: "tab", "aria-selected": a === etat.annee ? "true" : "false",
        onclick: function () { etat.annee = a; memoriser(); rendre(true); } }, [
        el("span", { classe: "an-jauge-an", texte: String(a) }),
        barre,
        el("span", { classe: "an-jauge-val " + (s.marge < 0 ? "neg" : "pos"), texte: s.marge < 0 ? "dépasse de " + md(-s.marge) : "marge " + md(s.marge) })
      ]));
    });
  }

  function selectionCorrespond(x) {
    var s = etat.selection;
    if (!s) return false;
    if (s.ligne && x.ligne === s.ligne) return true;
    return !s.ligne && s.pion && x.socle && x.pion === s.pion;
  }

  function rendreTable() {
    var p = params();
    var lignes = etat.vue === "arbitrage" ? M.lignesApresArbitrage(etat.lignes, p) : etat.lignes;
    var syn = M.synthese(PIONS, lignes, p)[etat.annee];
    // Filtre « Ma demande » : on ne pose que mes pions, regroupés sur une table compacte.
    var filtre = etat.maTable;
    var t = filtre
      ? M.placerAnnee(PIONS, lignes.filter(function (l) { return l.role === etat.role; }), p, etat.annee, function (x) { return pionAMoi(x); }, { apresArbitrage: etat.vue === "arbitrage" })
      : M.placerAnnee(PIONS, lignes, p, etat.annee, null, { apresArbitrage: etat.vue === "arbitrage" });
    if (filtre) {
      var bas = 0;
      t.pieces.forEach(function (x) { bas = Math.max(bas, x.r + x.h); });
      t.cellules.forEach(function (x) { bas = Math.max(bas, x.r + 1); });
      t.hauteur = Math.max(4, bas + 2);
    }
    document.querySelectorAll(".bascule button[data-vue]").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-vue") === etat.vue ? "true" : "false"); });
    document.querySelectorAll(".bascule button[data-filtre]").forEach(function (b) { b.setAttribute("aria-pressed", (b.getAttribute("data-filtre") === "mien") === etat.maTable ? "true" : "false"); });

    var rel = $("table-releve");
    vider(rel);
    [filtre ? ["Ma demande " + etat.annee, md(t.occupees * M.CASE) + " · " + t.occupees + " cases", ""] : ["Table " + etat.annee, t.occupees + " / " + t.plafond + " cases", ""], ["Montant total", md(syn.total), ""], ["Plafond", md(syn.plafond), ""],
      [syn.marge >= 0 ? "Marge" : "Dépassement", md(Math.abs(syn.marge)), syn.marge >= 0 ? "pos" : "neg"]].forEach(function (x) {
      rel.appendChild(el("div", { classe: "releve" }, [el("small", { texte: x[0] }), el("b", { classe: x[2], texte: x[1] })]));
    });
    $("consigne").textContent = arbitre()
      ? "Les demandes à trancher sont regroupées en bas, dans le cadre « Demandes à arbitrer ». Cliquez sur l'une d'elles pour la retenir, la différer ou y renoncer."
      : filtre ? "Vos pions seuls, regroupés. Cliquez sur un pion pour le modifier, sur une case vide pour en poser un nouveau. « Toute la table » les remet parmi les autres."
      : "Les pions en place sont votre point de départ. Cliquez sur un pion pour le modifier, sur une case vide pour en poser un nouveau.";

    var pl = $("plateau");
    vider(pl);
    pl.style.gridTemplateRows = "repeat(" + t.hauteur + ", var(--case))";
    for (var k = 0; k < t.hauteur * t.largeur; k++) {
      pl.appendChild(el("div", { classe: "fond fond-clic" + (filtre ? "" : k >= t.table ? " fond-horstable" : k >= t.plafond ? " fond-hors" : ""), title: "Poser un nouveau pion en " + etat.annee, style: "grid-row:" + (Math.floor(k / t.largeur) + 1) + ";grid-column:" + (k % t.largeur + 1),
        onclick: function () { etat.selection = null; etat.volet = "poser"; rendre(true); toast("Choisissez à droite le pion à poser en " + etat.annee); } }));
    }
    // Zone des demandes non encore arbitrées : un cadre et son titre.
    var enZone = t.pieces.filter(function (x) { return x.groupe === "Attente"; }).concat(t.cellules.filter(function (x) { return x.groupe === "Attente"; }));
    if (enZone.length) {
      var r1 = Math.min.apply(null, enZone.map(function (x) { return x.r; }));
      var r2 = Math.max.apply(null, enZone.map(function (x) { return x.r + (x.h || 1); }));
      var parStatut = { attente: {}, differe: {}, renonce: {} };
      enZone.forEach(function (x) { if (x.ligne && parStatut[x.statut]) parStatut[x.statut][x.ligne] = true; });
      var attente = Object.keys(parStatut.attente);
      var montant = attente.reduce(function (acc, id) { var l = ligneDe(id); return acc + (l ? M.coutLigne(l, IDX).annees[etat.annee].cout : 0); }, 0);
      var morceaux = [attente.length + " en attente d'arbitrage" + (attente.length ? " (" + md(montant) + ")" : "")];
      var nd = Object.keys(parStatut.differe).length, nr = Object.keys(parStatut.renonce).length;
      if (nd) morceaux.push(nd + " différée" + (nd > 1 ? "s" : ""));
      if (nr) morceaux.push(nr + " renoncée" + (nr > 1 ? "s" : ""));
      pl.appendChild(el("div", { classe: "zone-attente", style: "grid-row:" + r1 + " / " + (r2 + 1) + ";grid-column:1 / -1" }));
      pl.appendChild(el("div", { classe: "zone-attente-titre", style: "grid-row:" + r1 + ";grid-column:1 / -1" }, [el("span", { texte: "Demandes à arbitrer · " + morceaux.join(" · ") })]));
    }
    function depasse(r, c, w, h) { if (filtre) return false; for (var i = r; i < r + h; i++) for (var j = c; j < c + w; j++) if (i * t.largeur + j >= t.plafond) return true; return false; }
    function masque(x) { return x.role && !vueComplete() && x.role !== etat.role; }
    function estompe(x) { return false; }
    function choisir(x) {
      return function () {
        etat.selection = { ligne: x.ligne || null, pion: x.pion || null, socle: !!x.socle && !x.ligne };
        etat.volet = "selection";
        rendre(true);
      };
    }
    var F = window.STRAT_FIGURATIFS;
    function court(nom) { return nom.replace(/^Capacité /, "").replace(/^Brigade /, "Bde ").replace(/^\+ Capacité /, "+ "); }
    t.pieces.forEach(function (x) {
      var bande = x.groupe === "Fixes" ? "var(--gris-carte)" : x.nature === "violet" ? "var(--violet)" : x.nature === "orange" ? "var(--orange-carte)" : couleur(x.armee);
      var cl = ["pion", "pion-clic", "fig"];
      var aire = x.w * x.h, petit = Math.min(x.w, x.h) === 1 && Math.max(x.w, x.h) <= 3;
      cl.push(x.w >= x.h ? "fig-h" : "fig-v");
      if (petit) cl.push("fig-mini");
      if (x.nature === "orange") cl.push("fig-alea");
      if (x.niveau === 50) cl.push("fig-rouge");
      if (x.statut) cl.push("pion-" + x.statut);
      if (depasse(x.r, x.c, x.w, x.h)) cl.push("pion-debord");
      if (x.role && x.role === etat.role) cl.push("pion-mien");
      if (selectionCorrespond(x)) cl.push("pion-choisi");
      if (x.ligne && x.ligne === etat.neuf) cl.push("pion-neuf");
      if (estompe(x)) cl.push("pion-estompe");
      var cache = masque(x);
      var nom = cache ? "Demande " + x.armee : x.libelle;
      var pion = x.pion ? IDX[x.pion] : null;
      var picto = cache ? null : F.svg(F.pictoDe(x.libelle) || "puce");
      var enfants = [el("span", { classe: "fig-bande" }, [el("span", { classe: "fig-titre", texte: court(nom) })])];
      if (picto) enfants.push(el("span", { classe: "fig-picto" }, [picto]));
      if (pion && pion.type === "capacite" && M.nbDorese(pion) && !petit && aire >= 4) {
        var co = el("span", { classe: "fig-coins" });
        ["ao", "mco", "rh"].forEach(function (k) {
          var ic = F.svg(F.DORESE[k]);
          co.appendChild(el("span", { classe: "fig-coin", title: "DORESE " + k.toUpperCase() + " requises" }, [ic, el("b", { texte: String(pion.dorese[k]) })]));
        });
        enfants.push(co);
      }
      pl.appendChild(el("button", { type: "button", classe: cl.join(" "), title: nom + (x.niveau ? " · " + (x.niveau === 50 ? "face rouge (dégradée)" : "à 100 %") : "") + (x.role && !cache ? " · " + x.role : "") + (x.statut ? " · " + M.STATUTS[x.statut].toLowerCase() : x.socle ? " · socle arbitré" : " · retenu"),
        style: "grid-row:" + (x.r + 1) + " / span " + x.h + ";grid-column:" + (x.c + 1) + " / span " + x.w + ";--bande:" + bande, onclick: choisir(x) }, enfants));
    });
    t.cellules.forEach(function (x) {
      var cl = ["pion", "pion-case", "pion-clic"];
      cl.push(x.nature === "dorese" ? "jeton" : "jeton-option");
      if (x.statut) cl.push("pion-" + x.statut);
      if (x.horsCatalogue) cl.push("pion-mesure");
      if (x.r * t.largeur + x.c >= t.plafond) cl.push("pion-debord");
      if (x.role && x.role === etat.role) cl.push("pion-mien");
      var cible = x.nature === "dorese" && x.parent !== undefined ? t.pieces[x.parent] : x;
      if (x.ligne && x.ligne === etat.neuf) cl.push("pion-neuf");
      if (selectionCorrespond(cible) || (x.ligne && etat.selection && etat.selection.ligne === x.ligne)) cl.push("pion-choisi");
      if (x.nature === "dorese" ? estompe(cible) && estompe(x) : estompe(x)) cl.push("pion-estompe");
      var nom = masque(x) ? (x.nature === "dorese" ? "DORESE" : "Demande " + x.armee) : x.libelle;
      var ic = x.nature === "dorese" ? F.svg(F.DORESE[x.type]) : F.svg(masque(x) ? "document" : (F.pictoDe(x.libelle) || "document"));
      pl.appendChild(el("button", { type: "button", classe: cl.join(" "), title: nom, style: "grid-row:" + (x.r + 1) + ";grid-column:" + (x.c + 1) + ";--bande:" + couleur(x.armee),
        onclick: x.ligne && x.nature !== "dorese" ? choisir(x) : x.ligne ? choisir({ ligne: x.ligne, pion: cible.pion }) : choisir(cible) }, [ic]));
    });
    etat.neuf = null;

    var hors = $("hors-table");
    vider(hors);
    var absents = lignes.filter(function (l) { return (l.type === "retrait" || l.type === "degrade") && M.quantite(l, etat.annee) && visible(l); });
    if (absents.length) {
      hors.appendChild(el("span", { classe: "hors-titre", texte: "Retiré de la table en " + etat.annee + " :" }));
      absents.forEach(function (l) {
        hors.appendChild(el("button", { type: "button", classe: "hors-pion", onclick: function () { etat.selection = { ligne: l.id, pion: l.pion }; etat.volet = "selection"; rendre(true); } },
          [libelleLigne(l) + (l.type === "degrade" ? " (DORESE rendues)" : "") + " · " + l.role]));
      });
    }

    var lg = $("legende");
    vider(lg);
    function puce(style, cl, txt) { return el("span", null, [el("span", { classe: "puce-legende " + (cl || ""), style: style }), txt]); }
    lg.appendChild(puce("background:var(--gris)", "", "Dépense fixe"));
    lg.appendChild(puce("background:var(--violet)", "", "Investissement"));
    M.ARMEES.forEach(function (a) { lg.appendChild(puce("background:" + couleur(a), "", a)); });
    lg.appendChild(puce("background:var(--rouge)", "", "Face rouge : capacité dégradée"));
    ["ao", "mco", "rh"].forEach(function (k) {
      lg.appendChild(el("span", null, [el("span", { classe: "puce-legende jeton-legende", style: "--bande:var(--marine)" }, [F.svg(F.DORESE[k])]), { ao: "DORESE activité", mco: "DORESE MCO", rh: "DORESE RH" }[k]]));
    });
    lg.appendChild(puce("background:var(--case-vide)", "pion-mien", "Ma demande"));
    lg.appendChild(puce("background:var(--hors)", "", "Au-delà du plafond"));
    lg.appendChild(puce("background:var(--carte)", "pion-attente", "En attente d'arbitrage"));
    lg.appendChild(puce("background:var(--carte)", "pion-renonce", "Renoncé"));
    lg.appendChild(el("span", { classe: "note-legende", texte: "Le socle 2027 est considéré comme arbitré." }));
  }

  // ---------- Volet ----------
  function onglets() {
    var o = [["poser", "Poser"], ["selection", "Sélection"], ["demande", "Ma demande"]];
    if (arbitre() || vueComplete()) o.push(["arbitrage", "Arbitrage"]);
    o.push(["bilan", "Bilan"]);
    if (ROLES_REGLAGES.indexOf(etat.role) !== -1) o.push(["reglages", "Réglages"]);
    return o;
  }
  function rendreVolet() {
    var nav = $("volet-onglets");
    vider(nav);
    onglets().forEach(function (o) {
      nav.appendChild(el("button", { type: "button", role: "tab", "aria-selected": etat.volet === o[0] ? "true" : "false", texte: o[1],
        onclick: function () { etat.volet = o[0]; rendreVolet(); } }));
    });
    var v = $("volet");
    vider(v);
    ({ poser: voletPoser, selection: voletSelection, demande: voletDemande, arbitrage: voletArbitrage, bilan: voletBilan, reglages: voletReglages }[etat.volet] || voletPoser)(v);
  }

  function choixPortee() {
    var g = el("div", { classe: "portee", role: "group", "aria-label": "Années concernées" });
    var dernier = etat.annee === M.ANNEES[M.ANNEES.length - 1];

      ul.appendChild(el("li", null, [el("button", { type: "button", style: "--c:" + couleur(M.armeeDeLigne(l, IDX)), onclick: function () { etat.selection = { ligne: l.id, pion: l.pion || null }; etat.volet = "selection"; rendre(true); } }, [
        el("span", null, [el("b", { texte: libelleLigne(l) }), el("small", { texte: natureLigne(l) + " · " + anneesDe(l) })]),
        el("span", { classe: "num" }, [md(M.coutLigne(l, IDX).total), badgeDecision(l)])
      ])]));
    });
    v.appendChild(ul);
  }

  function voletArbitrage(v) {
    var p = params();
    v.appendChild(el("h2", { classe: "volet-titre", texte: "Arbitrage" }));
    var arb = M.synthese(PIONS, M.lignesApresArbitrage(etat.lignes, p), p);
    var tab = el("table", { classe: "mini-tableau" }, [el("thead", null, [el("tr", null, [el("th", { texte: "" }), el("th", { classe: "num", texte: "Retenu" }), el("th", { classe: "num", texte: "Marge" })])])]);
    var tb = el("tbody");
    M.ANNEES.forEach(function (a) { tb.appendChild(el("tr", null, [el("td", { texte: String(a) }), el("td", { classe: "num", texte: md(arb[a].total) }), el("td", { classe: "num " + (arb[a].marge < 0 ? "neg" : "pos"), texte: md(arb[a].marge) })])); });
    tab.appendChild(tb);
    v.appendChild(tab);
    var lignes = etat.lignes.filter(visible);
    var groupes = { attente: [], retenu: [], differe: [], renonce: [] };
    lignes.forEach(function (l) { groupes[M.arbitrageDe(l, p).statut].push(l); });
    Object.keys(groupes).forEach(function (k) {
      if (!groupes[k].length) return;
      var total = groupes[k].reduce(function (s, l) { return s + M.coutLigne(l, IDX).total; }, 0);
      v.appendChild(el("h3", { texte: M.STATUTS[k] + " · " + groupes[k].length + " · " + md(total) }));
      var ul = el("ul", { classe: "liste-demande" });
      groupes[k].forEach(function (l) {
        ul.appendChild(el("li", null, [el("button", { type: "button", style: "--c:" + couleur(M.armeeDeLigne(l, IDX)), onclick: function () { etat.selection = { ligne: l.id, pion: l.pion || null }; etat.volet = "selection"; var a1 = M.ANNEES.filter(function (a) { return M.quantite(l, a); })[0]; if (a1) etat.annee = a1; rendre(true); } }, [
          el("span", null, [el("b", { texte: libelleLigne(l) }), el("small", { texte: l.role + " · " + natureLigne(l) + " · " + anneesDe(l) })]),
          el("span", { classe: "num", texte: md(M.coutLigne(l, IDX).total) })
        ])]));
      });
      v.appendChild(ul);
    });
    if (!lignes.length) v.appendChild(el("p", { classe: "vide", texte: "Aucune demande pour l'instant." }));
  }

  function voletBilan(v) {
    var p = params();
    var syn = M.synthese(PIONS, etat.lignes, p);
    var arb = M.synthese(PIONS, M.lignesApresArbitrage(etat.lignes, p), p);
    v.appendChild(el("h2", { classe: "volet-titre", texte: "Bilan 2027-2032" }));
    var t = el("table", { classe: "mini-tableau" });
    t.appendChild(el("thead", null, [el("tr", null, [el("th", { texte: "Md€" }), el("th", { classe: "num", texte: "Socle" }), el("th", { classe: "num", texte: "Demandes" }), el("th", { classe: "num", texte: "Plafond" }), el("th", { classe: "num", texte: "Marge après arb." })])]));
    var tb = el("tbody");
    function n(m) { return (m / 1000).toLocaleString("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
    M.ANNEES.forEach(function (a) {
      tb.appendChild(el("tr", null, [el("td", { texte: String(a) }), el("td", { classe: "num", texte: n(syn[a].totalSocle) }), el("td", { classe: "num", texte: n(syn[a].totalDemandes) }), el("td", { classe: "num", texte: n(syn[a].plafond) }), el("td", { classe: "num " + (arb[a].marge < 0 ? "neg" : "pos"), texte: n(arb[a].marge) })]));
    });
    t.appendChild(tb);
    v.appendChild(t);
    v.appendChild(el("h3", { texte: "Demandes par armée, sur 6 ans" }));
    var ul = el("ul", { classe: "par-armee" });
    M.ARMEES.forEach(function (arm) {
      var s = M.ANNEES.reduce(function (acc, a) { return acc + syn[a].demandes[arm]; }, 0);
      ul.appendChild(el("li", null, [el("span", { classe: "pastille", style: "background:" + couleur(arm) }), arm, el("b", { classe: "num", texte: md(s) })]));
    });
    v.appendChild(ul);
    v.appendChild(el("button", { classe: "btn-contour", type: "button", texte: "Télécharger les lignes (CSV)", onclick: telechargerCsv }));
  }
  function telechargerCsv() {
    var p = params();
    var ent = ["Pôle", "Action", "Objet", "Armée"].concat(M.ANNEES.map(String)).concat(["Total (M€)", "Décision", "Justification"]);
    var out = [ent.join(";")];
    etat.lignes.filter(visible).forEach(function (l) {
      var c = M.coutLigne(l, IDX);
      var v = [l.role, natureLigne(l), libelleLigne(l), M.armeeDeLigne(l, IDX)].concat(M.ANNEES.map(function (a) { return c.annees[a].cout; }))
        .concat([c.total, M.STATUTS[M.arbitrageDe(l, p).statut], (l.justification || "").replace(/\s+/g, " ")]);
      out.push(v.map(function (x) { var s = String(x); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(";"));
    });
    var a = el("a", { href: URL.createObjectURL(new Blob(["﻿" + out.join("\n")], { type: "text/csv;charset=utf-8" })), download: "strategikon-" + etat.partie.nom + ".csv" });
    document.body.appendChild(a); a.click(); a.remove();
  }

  function voletReglages(v) {
    var p = params();
    v.appendChild(el("h2", { classe: "volet-titre", texte: "Réglages de la partie" }));
    var f = el("form", { classe: "form-reglages" });
    f.appendChild(el("h3", { texte: "Plafond annuel, en cases de 100 M€" }));
    var pf = el("div", { classe: "plafonds" });
    M.ANNEES.forEach(function (a) { pf.appendChild(el("label", null, [String(a), el("input", { id: "plafond-" + a, type: "number", min: 0, max: 2000, value: p.plafonds[a] })])); });
    f.appendChild(pf);
    f.appendChild(el("h3", { texte: "Pions de scénario posés" }));
    PIONS.filter(function (x) { return x.type === "orange"; }).forEach(function (o) {
      var an = ((p.aleas || {})[o.id] || []).map(Number);
      f.appendChild(el("div", { classe: "alea" }, [el("span", { texte: o.nom + " · " + md(o.cout50) }), el("div", { classe: "alea-annees" }, M.ANNEES.map(function (a) {
        var cb = el("input", { type: "checkbox", "data-pion": o.id, "data-annee": a });
        cb.checked = an.indexOf(a) !== -1;
        return el("label", null, [cb, " " + a]);
      }))]));
    });
    f.appendChild(el("button", { classe: "btn-laiton", type: "submit", texte: "Enregistrer" }));
    f.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var plaf = {}, aleas = {};
      M.ANNEES.forEach(function (a) { plaf[a] = Math.max(0, Number($("plafond-" + a).value) || 0); });
      f.querySelectorAll("input[type=checkbox]").forEach(function (cb) {
        var id = cb.getAttribute("data-pion"); aleas[id] = aleas[id] || [];
        if (cb.checked) aleas[id].push(Number(cb.getAttribute("data-annee")));
      });
      modifierParams(function (pp) { pp.plafonds = plaf; pp.aleas = aleas; }).then(function () { toast("Réglages enregistrés"); });
    });
    v.appendChild(f);
  }

  // ---------- Démarrage ----------
  function demarrer() {
    $("note-mode").textContent = S.mode === "partage" ? "Base partagée : chaque pôle voit les autres avancer en quelques secondes." : "Mode local : les parties restent dans ce navigateur.";
    $("btn-montrer-creer").addEventListener("click", function () { etapeAccueil("creer"); $("cre-nom").focus(); });
    $("btn-montrer-rejoindre").addEventListener("click", function () { etapeAccueil("rejoindre"); });
    $("form-rejoindre").addEventListener("submit", function (ev) {
      ev.preventDefault();
      $("rej-erreur").textContent = "";
      var nom = $("rej-partie").value, mdp = $("rej-mdp").value;
      if (!nom) { $("rej-erreur").textContent = "Ouvrez d'abord une partie, ou demandez son nom à l'animateur."; return; }
      S.ouvrirPartie(nom, mdp).then(function (p) { montrerRoles(p, mdp); }).catch(function (e) { $("rej-erreur").textContent = e.message; });
    });
    $("form-creer").addEventListener("submit", function (ev) {
      ev.preventDefault();
      $("cre-erreur").textContent = "";
      var nom = $("cre-nom").value.trim(), mdp = $("cre-mdp").value;
      if (mdp !== $("cre-mdp2").value) { $("cre-erreur").textContent = "Les deux mots de passe diffèrent."; return; }
      S.creerPartie(nom, mdp, M.parametresParDefaut()).then(function (p) { montrerRoles(p, mdp); }).catch(function (e) { $("cre-erreur").textContent = e.message; });
    });
    $("btn-retour-partie").addEventListener("click", quitter);
    $("btn-quitter").addEventListener("click", quitter);
    $("btn-role").addEventListener("click", function () { montrerRoles(etat.partie, etat.mdp); });
    document.querySelectorAll(".bascule button[data-vue]").forEach(function (b) { b.addEventListener("click", function () { etat.vue = b.getAttribute("data-vue"); rendre(false); }); });
    document.querySelectorAll(".bascule button[data-filtre]").forEach(function (b) { b.addEventListener("click", function () { etat.maTable = b.getAttribute("data-filtre") === "mien"; rendre(false); }); });
    setInterval(function () { if (etat.partie && etat.role && !Object.keys(enAttente).length) recharger(false); }, S.mode === "partage" ? 6000 : 5000);

    etapeAccueil("rejoindre");
    chargerParties().then(function () {
      var mem = null;
      try { mem = JSON.parse(sessionStorage.getItem(CLE_SESSION)); } catch (e) { mem = null; }
      if (mem && mem.nom && mem.role) {
        S.ouvrirPartie(mem.nom, mem.mdp).then(function (p) {
          etat.partie = p; etat.mdp = mem.mdp; if (mem.annee) etat.annee = mem.annee;
          return entrer(mem.role);
        }).catch(function () { etat.partie = null; memoriser(); });
      }
    });
  }

  demarrer();
})();

</script>
</body>
</html>
